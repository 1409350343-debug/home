<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>travel</title>
<link rel="icon" href="/static/favicon-32.png">
<script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20"><script src="/static/common.js?v=2"></script>
<style>
:root{--ink:#496653;--ink2:#6f886f;--ink3:#91a78d;--accent:#8caf78}
*{box-sizing:border-box}body{margin:0;background:#f8f1df;color:var(--ink);font-family:"Oleo Script","AaCheeseCJK",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh}
.page{height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:14px;padding:18px 22px;background:rgba(255,252,235,.82);border-bottom:1px solid rgba(133,161,113,.2);backdrop-filter:blur(20px);z-index:800}.back{width:36px;height:36px;border:0;border-radius:12px;background:#fffdf4;color:var(--ink2)}.title{flex:1}.title small{display:none}.title h1{font-size:20px;margin:2px 0 0}.stats{display:flex;gap:7px}.stat{min-width:84px;padding:7px 10px;background:#fffdf4;border-radius:12px;text-align:center}.stat b{font-size:18px}.stat small{display:block;color:var(--ink3);font-size:9px}
.stage{position:relative;min-height:0;overflow:hidden;background:linear-gradient(160deg,#e8efd9,#fbf6e6)}#map{height:100%;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.56),transparent 55%),linear-gradient(160deg,#e2ecd2,#fbf6e6)}#map.dragging{cursor:grabbing}.map-paper{position:absolute;left:50%;top:50%;width:1120px;height:560px;transform:translate(-50%,-50%);transform-origin:center;transition:transform 1s cubic-bezier(.16,1,.3,1);will-change:transform}.map-paper.free{transition:none}
.country-region{position:absolute;z-index:4;border:2px solid #6889a2;background:#c3d5df;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(42,72,91,.14);transition:background .45s ease,border-color .45s ease,box-shadow .45s ease,transform .35s ease}.country-region:hover{transform:scale(1.12)}.country-region.lit{background:#f4bd58;border-color:#c98228;box-shadow:0 0 0 5px rgba(244,189,88,.22),0 0 20px rgba(219,144,38,.52)}.country-region span{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);padding:4px 7px;border-radius:99px;background:rgba(255,255,255,.88);font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(39,71,100,.13)}.country-region.jp{left:87.3%;top:29%;width:16px;height:45px;border-radius:70% 38% 66% 45%;transform:rotate(18deg)}.country-region.jp:hover{transform:rotate(18deg) scale(1.14)}.country-region.is{left:43.7%;top:13%;width:31px;height:19px;border-radius:53% 47% 61% 39%/49% 42% 58% 51%;transform:rotate(-8deg)}.country-region.is:hover{transform:rotate(-8deg) scale(1.14)}.country-region.it{left:52.9%;top:26%;width:15px;height:34px;border-radius:68% 39% 72% 34%;transform:rotate(21deg);clip-path:polygon(10% 0,82% 5%,68% 58%,100% 82%,75% 100%,43% 72%,0 55%)}.country-region.it:hover{transform:rotate(21deg) scale(1.14)}
.city-layer{position:absolute;inset:0;z-index:7;pointer-events:none}.city-pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer}.pin{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:99px;background:#274c6d;color:#fff;box-shadow:0 4px 15px rgba(39,71,100,.25);font-size:11px;white-space:nowrap}.pin::before{content:'';width:8px;height:8px;border-radius:50%;background:#7fb5ec}.pin.lit::before{background:#f2b84b;box-shadow:0 0 0 4px rgba(242,184,75,.24)}.pin.locked{opacity:.68}
.map-tools{position:absolute;z-index:710;right:18px;bottom:18px;display:flex;gap:7px}.map-tools button{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.9);color:var(--ink);font-size:20px;box-shadow:0 4px 14px rgba(39,71,100,.16)}
.world-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 3px rgba(57,84,91,.12))}.country-shape{fill:#d8dfca;stroke:#879d91;stroke-width:.65;vector-effect:non-scaling-stroke;fill-rule:evenodd;transition:fill .38s ease,filter .38s ease,opacity .25s ease;cursor:default}.country-shape.available{fill:#c8d9df;stroke:#668aa3;stroke-width:1.15;cursor:pointer}.country-shape.available:hover{fill:#a9c8d8;filter:brightness(1.05) drop-shadow(0 0 4px rgba(74,119,151,.48))}.country-shape.lit{fill:#f4bd58;stroke:#c98228;stroke-width:1.6;filter:drop-shadow(0 0 5px rgba(219,144,38,.58))}.map-label{fill:rgba(54,83,96,.34);font:italic 12px Georgia,serif;letter-spacing:3px;pointer-events:none}.map-graticule{fill:none;stroke:rgba(79,123,145,.12);stroke-width:.7;stroke-dasharray:4 7;vector-effect:non-scaling-stroke;pointer-events:none}
.country-shape.lit{fill:#c8d9df;stroke:#668aa3;stroke-width:1.15;filter:none}.country-mode .world-svg{width:100%}.country-mode .city-layer{display:none}.world-dots{transition:opacity .3s}.country-mode .world-dots{opacity:0}.world-dot{pointer-events:none}.world-dot .halo{fill:rgba(246,184,64,.23)}.world-dot .core{fill:#f6b840;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #e59a22)}.city-map-point{cursor:pointer}.city-map-point .city-halo{fill:rgba(92,145,183,.15)}.city-map-point .city-core{fill:#8ab1cf;stroke:#fff;stroke-width:.24}.city-map-point.visited .city-halo{fill:rgba(246,184,64,.24)}.city-map-point.visited .city-core{fill:#f6b840;filter:drop-shadow(0 0 1px #dc8e1c)}.city-map-point .leader{stroke:#547a98;stroke-width:.2;stroke-dasharray:.7 .5}.city-map-point text{fill:#244a69;font-size:1.65px;font-weight:700;paint-order:stroke;stroke:rgba(239,247,250,.98);stroke-width:.65;stroke-linejoin:round}.city-map-point:hover .city-halo{fill:rgba(246,184,64,.42)}.city-map-point:hover text{fill:#c97718}
.country-mode .world-svg{width:73%;transition:width .65s cubic-bezier(.16,1,.3,1)}.country-mode .country-shape:not(.focused){opacity:0;pointer-events:none}.country-mode .country-shape.focused{fill:#f4bd58;stroke:#bd7721;stroke-width:2.1;filter:drop-shadow(0 0 8px rgba(219,144,38,.48))}.country-mode .map-label,.country-mode .map-graticule{opacity:0}.city-copy{text-align:left;line-height:1.2}.city-copy b{display:block;font-size:12px}.city-copy small{font-size:8px;opacity:.72}.country-mode .city-layer{left:75%;right:2.5%;top:25%;bottom:25%;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px;border-radius:20px;background:rgba(255,255,255,.32);box-shadow:0 9px 28px rgba(37,69,91,.1);backdrop-filter:blur(12px)}.country-mode .city-pin{position:static;transform:none;width:100%}.country-mode .pin{width:100%;min-height:52px;border-radius:15px;padding:9px 12px;gap:9px;transition:transform .25s ease,box-shadow .25s ease}.country-mode .city-pin:hover .pin{transform:translateX(-5px);box-shadow:0 8px 20px rgba(39,71,100,.3)}
.guide{position:absolute;z-index:700;left:18px;bottom:18px;width:min(310px,calc(100% - 36px));padding:14px;border-radius:16px;background:rgba(255,255,255,.86);box-shadow:0 7px 24px rgba(35,65,93,.16);backdrop-filter:blur(18px)}.guide b{font-size:13px}.guide p{font-size:11px;color:var(--ink2);line-height:1.6;margin:5px 0 0}.world-btn{display:none;margin-top:8px;border:0;border-radius:9px;background:#e6eef5;color:var(--ink2);padding:7px 10px}
@media(max-width:680px){.top{padding:12px}.stats .stat:nth-child(3){display:none}.stat{min-width:58px;padding:6px}.title h1{font-size:17px}}
@media(max-width:680px){.country-mode .world-svg{width:100%;height:58%}.country-mode .city-layer{left:8%;right:8%;top:57%;bottom:4%;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.country-mode .pin{min-height:42px;padding:7px 9px}}
.country-mode .world-svg{width:100%!important;height:100%!important}.country-mode .city-layer{display:none!important}.country-mode .country-shape.focused{fill:#c8d9df;stroke:#668aa3;stroke-width:1.4;filter:drop-shadow(0 0 5px rgba(74,119,151,.25))}
.country-shape{fill:#dce4c9;stroke:#8ca17f}.country-shape.available,.country-shape.lit,.country-mode .country-shape.focused{fill:#c6d9b2;stroke:#6f9565;filter:none}.country-shape.available:hover{fill:#adc895;filter:brightness(1.04) drop-shadow(0 0 4px rgba(99,139,82,.42))}.map-label{fill:rgba(73,102,83,.36);font-family:"Oleo Script",cursive}.map-graticule{stroke:rgba(103,139,85,.12)}.city-map-point .city-halo{fill:rgba(111,149,101,.16)}.city-map-point .city-core{fill:#8caf78}.city-map-point .leader{stroke:#6f9565}.city-map-point text{fill:#496653;stroke:rgba(249,247,227,.98)}.pin{background:#658b59;box-shadow:0 4px 15px rgba(73,102,83,.22)}.pin::before{background:#bfd4a8}.guide{background:rgba(255,252,235,.88);box-shadow:0 7px 24px rgba(65,92,54,.14)}.world-btn{background:#e8f0da}.map-tools button{background:rgba(255,252,235,.92);box-shadow:0 4px 14px rgba(65,92,54,.14)}
</style></head><body><div class="page">
<header class="top"><button class="back" onclick="location.href='/'" aria-label="返回"><i data-lucide="chevron-left"></i></button><div class="title"><h1 class="english-page-title">travel</h1></div><div class="stats"><div class="stat"><b id="countryN">0</b><small>COUNTRIES</small></div><div class="stat"><b id="cityN">0</b><small>CITIES</small></div><div class="stat"><b id="topicN">0</b><small>TOPICS</small></div></div></header>
<main class="stage"><div id="map"><div class="map-paper" id="mapPaper"><svg class="world-svg" id="worldSvg" viewBox="0 0 1000 500" role="img" aria-label="可点亮的世界地图"><g class="map-graticule"><path d="M0 125H1000M0 250H1000M0 375H1000M250 0V500M500 0V500M750 0V500"/></g><g id="worldLayer"></g><g class="world-dots" id="worldDots"></g><g id="citySvgLayer"></g><g class="map-label"><text x="142" y="112">NORTH AMERICA</text><text x="265" y="350">SOUTH AMERICA</text><text x="505" y="98">EUROPE</text><text x="518" y="304">AFRICA</text><text x="705" y="130">ASIA</text><text x="805" y="393">OCEANIA</text><text x="90" y="455">little world atlas</text></g></svg><div class="city-layer" id="cityLayer"></div></div></div><div class="map-tools"><button onclick="zoomBy(1.18)" aria-label="放大">＋</button><button onclick="zoomBy(.84)" aria-label="缩小">−</button></div><aside class="guide"><b id="guideTitle">选择一个国家</b><p id="guideText">亮点代表已经去过的地方，点击国家查看城市位置。</p><button class="world-btn" id="worldBtn" onclick="showWorld()">返回世界地图</button></aside></main>
</div><script>
let atlas,state,scale=1,offsetX=0,offsetY=0,dragStart=null,focusedCountry=null;
const fallback={visited_countries:['jp'],visited_cities:['jp:kyoto'],opened_topics:['jp:kyoto']};
async function init(){
 [atlas,state]=await Promise.all([fetch('/data/travel/atlas.json').then(r=>r.json()),fetch('/api/travel/state').then(r=>r.json()).catch(()=>fallback)]);
 countryN.textContent=state.visited_countries?.length||0;cityN.textContent=state.visited_cities?.length||0;topicN.textContent=state.opened_topics?.length||0;
 await addCountryRegions();refreshWorldDots();bindMapGestures();fitMap();
 if(window.lucide)lucide.createIcons();
}
async function addCountryRegions(){
 const geo=await fetch('/data/travel/world.geojson').then(r=>r.json()),byIso=new Map(atlas.countries.map(c=>[c.iso,c]));
 geo.features.forEach(feature=>{const c=byIso.get(feature.properties.iso),path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',feature.geometry.coordinates.map(ring=>'M'+ring.map(([lng,lat])=>`${((lng+180)/360*1000).toFixed(2)},${((90-lat)/180*500).toFixed(2)}`).join('L')+'Z').join(''));path.setAttribute('class',`country-shape${c?' available':''}${c&&(state.visited_countries||[]).includes(c.id)?' lit':''}`);path.dataset.iso=feature.properties.iso;path.setAttribute('aria-label',c?`打开${c.name}`:feature.properties.name);if(c)path.onclick=e=>{e.stopPropagation();openCountry(c)};else path.onclick=()=>{guideTitle.textContent=feature.properties.name;guideText.textContent='这个国家还没有生成专题，之后可以继续补充。'};worldLayer.appendChild(path)})
}
function openCountry(c){
 focusedCountry=c;cityLayer.innerHTML='';citySvgLayer.innerHTML='';focusOnCountry(c);
 guideTitle.textContent=c.name+' · '+c.name_en;guideText.textContent='已点亮的城市会保持发光。点击城市进入永久保存的 AI 专题页。';worldBtn.style.display='inline-block';
 if(!(state.visited_countries||[]).includes(c.id)){state.visited_countries=[...(state.visited_countries||[]),c.id];countryN.textContent=state.visited_countries.length}
 document.querySelector(`[data-iso="${c.iso}"]`)?.classList.add('lit');
 refreshWorldDots();
 visit(c.id);
 renderCities(c);
}
function renderCities(c){citySvgLayer.innerHTML='';const offsets=[[-6,2.5],[5,-2.4],[5,3.6],[-5,-3.5]];c.cities.forEach((city,i)=>{const lit=(state.visited_cities||[]).includes(`${c.id}:${city.id}`),p=projectSvg(city.lat,city.lng),[dx,dy]=offsets[i%offsets.length],g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class',`city-map-point${lit?' visited':''}${city.ready?'':' locked'}`);g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.innerHTML=`<circle class="city-halo" r="${lit?1.25:.9}"/><circle class="city-core" r=".55"/><line class="leader" x1="0" y1="0" x2="${dx}" y2="${dy}"/><text x="${dx+(dx<0?-1:.7)}" y="${dy+.5}" text-anchor="${dx<0?'end':'start'}">${city.name} · ${city.name_en}</text>`;g.onclick=e=>{e.stopPropagation();openCity(c,city)};citySvgLayer.appendChild(g)})}
function openCity(c,city){if(!city.ready){guideTitle.textContent=city.name+'正在设计';guideText.textContent='这座城市还没有生成专题页，之后可以由 AI 补齐并永久保存。';return}visit(c.id,city.id,true);setTimeout(()=>location.href=`/travel-city.html?country=${c.id}&city=${city.id}`,180)}
function visit(country,city='',topic=false){fetch('/api/travel/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country,city,topic_opened:topic})}).then(r=>r.json()).then(x=>{if(x.state)state=x.state}).catch(()=>{})}
function project(lat,lng){return{x:(lng+180)/360*100,y:(90-lat)/180*100}}
function projectSvg(lat,lng){return{x:(lng+180)/360*1000,y:(90-lat)/180*500}}
function refreshWorldDots(){worldDots.innerHTML='';(state.visited_countries||[]).forEach(id=>{const c=atlas.countries.find(x=>x.id===id);if(!c)return;const p=projectSvg(c.lat,c.lng),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','world-dot');g.setAttribute('transform',`translate(${p.x} ${p.y})`);g.innerHTML='<circle class="halo" r="6"/><circle class="core" r="2.8"/>';worldDots.appendChild(g)})}
function fitMap(){const r=map.getBoundingClientRect();scale=Math.min(r.width/1120,r.height/560)*.92;offsetX=offsetY=0;applyTransform()}
function focusOnCountry(c){const path=document.querySelector(`[data-iso="${c.iso}"]`);document.querySelectorAll('.country-shape').forEach(x=>x.classList.toggle('focused',x===path));map.classList.add('country-mode');if(path){const b=path.getBBox(),pad=Math.max(b.width,b.height)*.22;worldSvg.setAttribute('viewBox',`${b.x-pad} ${b.y-pad} ${b.width+pad*2} ${b.height+pad*2}`)}const r=map.getBoundingClientRect();scale=Math.min(r.width/1120,r.height/560)*.92;offsetX=offsetY=0;applyTransform()}
function applyTransform(){mapPaper.style.transform=`translate(calc(-50% + ${offsetX}px),calc(-50% + ${offsetY}px)) scale(${scale})`}
function zoomBy(mult){scale=Math.max(.45,Math.min(3.8,scale*mult));applyTransform()}
function bindMapGestures(){map.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.city-map-point')||e.target.classList.contains('country-shape'))return;dragStart={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY};map.classList.add('dragging');mapPaper.classList.add('free');map.setPointerCapture(e.pointerId)});map.addEventListener('pointermove',e=>{if(!dragStart)return;offsetX=dragStart.ox+e.clientX-dragStart.x;offsetY=dragStart.oy+e.clientY-dragStart.y;applyTransform()});const end=()=>{dragStart=null;map.classList.remove('dragging');mapPaper.classList.remove('free')};map.addEventListener('pointerup',end);map.addEventListener('pointercancel',end);map.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:.9)},{passive:false})}
function showWorld(){focusedCountry=null;cityLayer.innerHTML='';citySvgLayer.innerHTML='';map.classList.remove('country-mode');document.querySelectorAll('.country-shape').forEach(x=>x.classList.remove('focused'));worldSvg.setAttribute('viewBox','0 0 1000 500');fitMap();guideTitle.textContent='选择一个国家';guideText.textContent='亮点代表已经去过的地方，点击国家查看城市位置。';worldBtn.style.display='none'}
window.addEventListener('resize',()=>{if(!focusedCountry)fitMap()});window.addEventListener('DOMContentLoaded',init);
</script></body></html>
