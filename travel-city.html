<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CITY TOPIC</title>
<link rel="icon" href="/static/favicon-32.png"><script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20"><script src="/static/common.js?v=2"></script>
<style>
:root{--ink:#496653;--ink2:#6f886f;--ink3:#91a78d;--accent:#8caf78;--paper:#fffbed}
*{box-sizing:border-box}body{margin:0;background:#f8f1df url('/static/summer-green-background.png') center bottom/cover fixed;color:var(--ink);font-family:"Oleo Script","AaCheeseCJK",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100vh;overflow:hidden}.layout{height:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr);background:rgba(255,250,226,.32)}.topic{min-width:0;overflow-y:auto;padding:18px 22px 34px}.head{display:flex;align-items:center;gap:12px;margin-bottom:13px}.back{width:36px;height:36px;border:0;border-radius:11px;background:rgba(255,252,235,.82);color:var(--ink2)}.head small{font-family:"Oleo Script",cursive;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:1px}.head h1{font-size:22px;margin:2px 0;font-weight:700}.saved{margin-left:auto;font-size:9px;color:#638667;background:#e6f0db;padding:5px 9px;border-radius:99px}
.folds{height:min(48vh,430px);display:flex;gap:0;overflow:hidden;border-radius:22px;box-shadow:0 13px 35px rgba(32,57,80,.18);transform:translateZ(0);touch-action:pan-y;user-select:none}.fold{position:relative;flex:1 1 0;min-width:68px;padding:0;border:0;background:#1f3345;overflow:hidden;cursor:pointer;will-change:flex-grow;transition:flex-grow .72s cubic-bezier(.16,1,.3,1),filter .42s ease}.fold.active{flex-grow:5}.fold img{width:100%;height:100%;object-fit:cover;filter:saturate(.78) brightness(.7);transform:scale(1.08);will-change:transform,filter;pointer-events:none;transition:filter .58s ease,transform .9s cubic-bezier(.16,1,.3,1),opacity .35s ease}.fold:hover img{filter:saturate(1) brightness(.94);transform:scale(1.14)}.fold.active img{filter:saturate(1) brightness(1);transform:scale(1.015)}.fold.active:hover img{transform:scale(1.075)}.fold::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,20,30,.32),transparent 48%);opacity:1;pointer-events:none;transition:opacity .5s ease}.fold.active::after{opacity:.45}.fold-label{position:absolute;z-index:2;left:13px;bottom:13px;color:#fff;writing-mode:vertical-rl;font-size:11px;letter-spacing:2px;text-shadow:0 1px 5px #000;pointer-events:none;transition:opacity .25s ease,transform .55s cubic-bezier(.16,1,.3,1)}.fold.active .fold-label{writing-mode:horizontal-tb;font-size:13px;transform:translateY(-2px)}
.photo-nav{height:27px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink3);font-size:9px}.photo-dot{width:6px;height:6px;border:0;border-radius:50%;padding:0;background:#bac8d2;transition:width .3s ease,background .3s ease}.photo-dot.on{width:20px;border-radius:99px;background:var(--accent)}.swipe-hint{margin-left:5px;letter-spacing:.6px}
.story{display:none}
.chat{display:grid;grid-template-rows:auto 1fr auto;background:rgba(255,252,235,.9);border-left:1px solid rgba(133,161,113,.25);min-width:0}.chat-head{padding:19px;border-bottom:1px solid rgba(133,161,113,.22)}.chat-head b{font-size:14px}.chat-head small{display:block;color:var(--ink3);font-size:10px;margin-top:3px}.messages{padding:14px;overflow-y:auto}.msg{max-width:88%;padding:9px 11px;border-radius:13px;margin-bottom:8px;font-size:12px;line-height:1.6;background:#fffdf4}.msg.me{margin-left:auto;background:#e8f0da}.composer{display:flex;gap:7px;padding:12px;border-top:1px solid rgba(133,161,113,.22)}.composer textarea{flex:1;resize:none;border:1px solid rgba(133,161,113,.28);border-radius:13px;padding:9px;font:inherit;min-height:42px;background:#fffdf7;color:var(--ink)}.composer button{width:42px;border:0;border-radius:13px;background:var(--accent);color:#fff}
.mobile-tabs{display:none}
@media(max-width:760px){body{overflow:auto}.layout{display:block;height:auto}.topic{padding:13px}.chat{min-height:72vh;border:0}.folds{height:370px}.mobile-tabs{display:flex;position:sticky;top:0;z-index:20;background:#f2f4df;padding:8px;gap:7px}.mobile-tabs button{flex:1;border:0;border-radius:10px;padding:8px}.mobile-tabs button.on{background:var(--accent);color:#fff}.layout.show-chat .topic{display:none}.layout:not(.show-chat) .chat{display:none}}
.folds{height:min(47vh,420px);gap:12px;overflow-x:auto;overflow-y:hidden;padding:13px;border-radius:22px;background:rgba(255,255,255,.38);box-shadow:0 13px 35px rgba(32,57,80,.13);scroll-behavior:smooth;scrollbar-width:none}.folds::-webkit-scrollbar{display:none}.fold{flex:0 0 clamp(82px,12vw,122px);min-width:0;height:100%;border-radius:18px;box-shadow:0 6px 18px rgba(27,48,67,.16);scroll-snap-align:center;transition:flex-basis .62s cubic-bezier(.16,1,.3,1),transform .36s ease,filter .36s ease}.fold.active{flex-grow:0;flex-basis:clamp(150px,23vw,220px)}.fold:hover{transform:translateY(-5px) scale(1.025);z-index:3}.fold img{transform:scale(1.04);filter:saturate(.9) brightness(.86)}.fold:hover img{transform:scale(1.12);filter:saturate(1) brightness(1)}.fold.active img{transform:scale(1.025);filter:saturate(1) brightness(1)}.fold.active:hover img{transform:scale(1.09)}.fold-label,.fold.active .fold-label{writing-mode:horizontal-tb;left:12px;right:8px;bottom:12px;font-size:11px;letter-spacing:1px;transform:none;text-align:left}
.folds{height:min(48vh,430px);align-items:center;gap:9px;padding:28px 24px 20px;border-radius:0;background:transparent;box-shadow:none;scroll-behavior:auto;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:none}.fold{flex:0 0 clamp(68px,8vw,82px);width:auto;height:calc(100% - 38px);border-radius:17px;transform:none;filter:none;will-change:flex-basis;box-shadow:0 7px 19px rgba(27,48,67,.16);transition:flex-basis .48s cubic-bezier(.16,1,.3,1),box-shadow .3s ease}.fold.active{flex-basis:clamp(190px,23vw,230px);width:auto;transform:none;filter:none;z-index:5;box-shadow:0 15px 34px rgba(26,46,65,.27)}.fold:hover:not(.active){transform:translateY(-2px);filter:brightness(1.04);z-index:4}.fold.active:hover{transform:none}.fold img,.fold.active img,.fold:hover img{width:100%;height:100%;object-fit:cover;object-position:var(--focus,50%) center;transform:none;filter:none;background:transparent}.fold-label,.fold.active .fold-label{font-size:9px}.photo-nav{display:none}
@media(prefers-reduced-motion:reduce){.fold,.fold img,.fold::after,.fold-label,.story{transition-duration:.01ms!important}}
</style></head><body>
<div class="mobile-tabs"><button class="on" onclick="showMobile(false,this)">CITY</button><button onclick="showMobile(true,this)">CHAT</button></div>
<main class="layout" id="layout"><section class="topic"><header class="head"><button class="back" onclick="location.href='/travel.html'"><i data-lucide="chevron-left"></i></button><div><small id="countryName">CLOUD TRAVEL</small><h1 id="cityName">Loading…</h1></div><span class="saved">永久保存</span></header><div class="folds" id="folds"></div><div class="photo-nav" id="photoNav"></div><article class="story"><small id="storyType"></small><h2 id="storyTitle"></h2><p id="storyText"></p><div class="credit" id="credit"></div></article></section>
<aside class="chat"><header class="chat-head"><b>和福福云游这座城</b><small id="chatContext">他知道你正在看的地点和照片</small></header><div class="messages" id="messages"><div class="msg">我们到京都了。你点左边任何一张照片，我都可以陪你继续往下看。</div></div><div class="composer"><textarea id="chatInput" placeholder="问问这里的风景、食物或故事…"></textarea><button onclick="sendChat()"><i data-lucide="send"></i></button></div></aside></main>
<script>
let country,city,gallerySlides=[],current=0,storyTimer;const esc=HomeCommon.escapeHtml;
async function init(){const q=new URLSearchParams(location.search),cid=q.get('country')||'jp',cityid=q.get('city')||'kyoto';const atlas=await fetch('/data/travel/atlas.json').then(r=>r.json());country=atlas.countries.find(x=>x.id===cid);city=country?.cities.find(x=>x.id===cityid);if(!city?.ready){location.href='/travel.html';return}gallerySlides=Array.from({length:10},(_,i)=>({...city.slides[i%city.slides.length],galleryIndex:i}));document.title=city.name_en+' · CLOUD TRAVEL';countryName.textContent=country.name_en+' · CLOUD TRAVEL';cityName.textContent=city.name+' '+city.name_en;folds.innerHTML=gallerySlides.map((s,i)=>`<button class="fold ${i===0?'active':''}" style="--focus:${25+(i*17)%55}%" onclick="selectSlide(${i},event,false)"><img src="${s.image}" alt="${esc(s.title)}" draggable="false"><span class="fold-label">${esc(s.type)}</span></button>`).join('');photoNav.innerHTML='';selectSlide(0,null,false);loadChat();fetch('/api/travel/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country:country.id,city:city.id,topic_opened:true})}).catch(()=>{});if(window.lucide)lucide.createIcons()}
function selectSlide(i,event,center=true){if(!gallerySlides[i])return;current=i;const cards=document.querySelectorAll('.fold');cards.forEach((x,n)=>{const on=n===i;x.classList.toggle('active',on);x.setAttribute('aria-pressed',String(on))});const s=gallerySlides[i],story=document.querySelector('.story');clearTimeout(storyTimer);story.classList.add('switching');storyTimer=setTimeout(()=>{storyType.textContent=s.type;storyTitle.textContent=s.title;storyText.textContent=s.description;credit.textContent=s.source;chatContext.textContent=`当前：${city.name} · ${s.title}`;requestAnimationFrame(()=>story.classList.remove('switching'))},130);if(center)setTimeout(()=>cards[i]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),30)}
async function loadChat(){try{const all=await fetch('/api/read/chat').then(r=>r.json());const key=`travel:${country.id}:${city.id}`;(all||[]).filter(x=>x.book_id===key).forEach(addMsg)}catch(e){}}
function addMsg(m){const div=document.createElement('div');div.className='msg '+(m.sender==='小羊'?'me':'');div.textContent=m.text||m.content||'';messages.appendChild(div);messages.scrollTop=messages.scrollHeight}
async function sendChat(){const text=chatInput.value.trim();if(!text)return;chatInput.value='';const s=gallerySlides[current],payload={text:`【云旅游·${city.name}·${s.title}】${text}`,sender:'小羊',page:-1,book_id:`travel:${country.id}:${city.id}`};addMsg(payload);try{await fetch('/api/read/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){}}
function showMobile(chat,btn){layout.classList.toggle('show-chat',chat);document.querySelectorAll('.mobile-tabs button').forEach(x=>x.classList.toggle('on',x===btn))}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
