<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>海龟汤 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20">
<script src="/static/common.js?v=2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg, #e8f0fe) var(--bg-img, url('/static/bg.jpg')) center/cover fixed;
    min-height: 100vh;
    color: var(--ink, #3a4a6b);
    padding-bottom: 90px;
  }

  .header {
    display: flex; align-items: center;
    padding: 16px 20px 12px; gap: 12px;
    position: sticky; top: 0; z-index: 5;
  }

  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.6); border-radius: 12px;
    border: none; cursor: pointer; color: var(--accent, #5b7ec2);
  }

  .header h1 { font-size: 20px; font-weight: 600; flex: 1; }

  .status-pill {
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.7); color: #8a9bbc;
  }
  .status-pill.playing { background: rgba(120,200,140,0.2); color: #3d9e5c; }
  .status-pill.finished { background: rgba(210,160,100,0.2); color: #c29a4a; }

  .wrap { padding: 0 16px; }

  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 10px rgba(100,140,210,0.07);
  }

  .card h3 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .surface-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .empty-tip { text-align: center; color: #8a9bbc; font-size: 13px; padding: 30px 0; }

  .scoreboard { display: flex; gap: 10px; margin-bottom: 12px; }
  .score {
    flex: 1; text-align: center;
    background: rgba(255,255,255,0.75); border-radius: 14px; padding: 10px;
    border: 1px solid rgba(255,255,255,0.9);
    font-size: 12px; color: #8a9bbc;
  }
  .score b { display: block; font-size: 20px; color: var(--ink, #3a4a6b); }

  .log-item { padding: 10px 0; border-bottom: 1px dashed rgba(140,160,200,0.25); }
  .log-item:last-child { border-bottom: none; }
  .log-q { font-size: 14px; line-height: 1.6; }
  .log-q .who { font-weight: 600; margin-right: 6px; }
  .log-a { font-size: 13px; margin-top: 4px; padding-left: 2px; }
  .ans-yes { color: #3d9e5c; }
  .ans-no { color: #d66a6a; }
  .ans-other { color: #c29a4a; }
  .ans-pending { color: #8a9bbc; }
  .log-item.guess .log-q { color: #b0568a; }

  .result-card { border-left: 4px solid #c29a4a; }
  .result-card .surface-text { font-size: 13px; }

  .input-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
    display: flex; gap: 8px;
    border-top: 1px solid rgba(255,255,255,0.9);
  }
  .input-bar input {
    flex: 1; border: 1px solid rgba(140,160,200,0.35); border-radius: 12px;
    padding: 10px 14px; font-size: 14px; outline: none;
    background: rgba(255,255,255,0.9); color: var(--ink, #3a4a6b);
  }
  .input-bar button {
    border: none; border-radius: 12px; padding: 0 14px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #askBtn { background: var(--accent, #5b7ec2); color: #fff; }
  #guessBtn { background: rgba(176,86,138,0.15); color: #b0568a; }
</style>
<script src="/static/theme.js?v=40"></script>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='/games.html'">
    <i data-lucide="chevron-left"></i>
  </button>
  <h1>海龟汤</h1>
  <span class="status-pill" id="statusPill">加载中</span>
</div>

<div class="wrap">
  <div class="card" id="surfaceCard">
    <h3>🐢 汤面</h3>
    <div class="surface-text" id="surfaceText">还没开局。让福福抽一道题就开始。</div>
  </div>

  <div class="scoreboard">
    <div class="score">🐑 小羊问了<b id="sheepCount">0</b></div>
    <div class="score">🦊 福福问了<b id="foxCount">0</b></div>
  </div>

  <div class="card result-card" id="resultCard" style="display:none">
    <h3>🏁 汤底</h3>
    <div class="surface-text" id="resultText"></div>
  </div>

  <div class="card">
    <h3>💬 问答记录</h3>
    <div id="logList"><div class="empty-tip">还没有人提问</div></div>
  </div>
</div>

<div class="input-bar">
  <input id="qInput" placeholder="问一个是/否问题…" maxlength="1000">
  <button id="askBtn">提问</button>
  <button id="guessBtn">猜汤底</button>
</div>

<script>
lucide.createIcons();

const $ = id => document.getElementById(id);

function ansClass(a) {
  if (!a) return 'ans-pending';
  if (/^(是|对|没错|yes)/i.test(a)) return 'ans-yes';
  if (/^(不是|不对|否|no)/i.test(a)) return 'ans-no';
  return 'ans-other';
}

async function refresh() {
  try {
    const s = await fetch('/api/game/turtle').then(r => r.json());
    const pill = $('statusPill');
    const map = { idle: '未开局', playing: '进行中', finished: '已结束' };
    pill.textContent = map[s.status] || s.status || '未开局';
    pill.className = 'status-pill ' + (s.status || '');

    $('surfaceText').textContent = s.surface
      ? (s.title ? '【' + s.title + '】\n' + s.surface : s.surface)
      : '还没开局。让福福抽一道题就开始。';

    const logs = s.logs || [];
    $('sheepCount').textContent = logs.filter(l => l.who === '小羊' && l.kind !== 'guess').length;
    $('foxCount').textContent = logs.filter(l => l.who === '福福' && l.kind !== 'guess').length;

    if (s.status === 'finished' && s.result) {
      $('resultCard').style.display = '';
      $('resultText').textContent = s.result;
    } else {
      $('resultCard').style.display = 'none';
    }

    const list = $('logList');
    if (!logs.length) {
      list.innerHTML = '<div class="empty-tip">还没有人提问</div>';
    } else {
      list.innerHTML = logs.map(l => {
        const emoji = l.who === '小羊' ? '🐑' : '🦊';
        const tag = l.kind === 'guess' ? '【猜汤底】' : '';
        const ans = l.pending ? '⏳ 等裁判…' : (l.a || '');
        return '<div class="log-item ' + (l.kind || '') + '">' +
          '<div class="log-q"><span class="who">' + emoji + l.who + '</span>' + tag + esc(l.q) + '</div>' +
          '<div class="log-a ' + ansClass(l.a) + '">' + esc(ans) + '</div></div>';
      }).join('');
    }
  } catch (e) { /* 网络抖动忽略 */ }
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function submit(kind) {
  const input = $('qInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  await fetch('/api/game/turtle/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content, kind })
  });
  refresh();
}

$('askBtn').onclick = () => submit('ask');
$('guessBtn').onclick = () => submit('guess');
$('qInput').addEventListener('keydown', e => { if (e.key === 'Enter') submit('ask'); });

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
