<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>陪读看板</title>
<script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20">
<link rel="stylesheet" href="/static/core-nav.css?v=14">
<script src="/static/common.js?v=2"></script>
<script src="/static/core-nav.js?v=4"></script>
<style>
  @font-face{font-family:'Yozai';src:url('/static/yozai.woff2') format('woff2');font-display:swap}

  :root{
    --bg:#edf3fa; --card:#ffffff; --card2:#f4f8fd;
    --ink:#1c3350; --ink2:#4c6a8c; --ink3:#8aa3bd;
    --accent:#88ad73; --accent-dark:#648b58; --accent-soft:#e7efdc;
    --border:#dce8cf; --ring-track:#eaf0df;
    --hm0:#edf2e5; --hm1:#dce8ce; --hm2:#bdd3a8; --hm3:#91b675; --hm4:#628d55;
  }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Yozai',-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh; padding:20px 16px 48px;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 2px 20px}
  .head-title{display:flex;align-items:center;gap:10px}
  .back-shelf{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent-dark);
    display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--border)}
  .back-shelf svg{width:18px;height:18px}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  h1 .fox{margin-right:6px}
  .date-chip{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--border);
    padding:4px 10px;border-radius:999px;white-space:nowrap}
  h2{font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:2px;margin:26px 2px 12px;
    display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;height:1px;background:var(--border)}

  /* 统计 tiles */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 12px;text-align:center}
  .tile .num{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .tile .num small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:1px}
  .tile .lbl{font-size:11px;color:var(--ink3);margin-top:4px;letter-spacing:1px}

  /* 书架卡片 */
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .book{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;
    display:flex;flex-direction:column;gap:12px}
  .book-top{display:flex;gap:14px;align-items:center}
  .ring{flex:none;width:56px;height:56px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--accent)}
  .book-title{font-size:15px;font-weight:700;line-height:1.4;word-break:break-all}
  .book-meta{font-size:12px;color:var(--ink2);line-height:1.9}
  .book-meta b{color:var(--ink);font-weight:600}
  .go{display:block;text-align:center;background:var(--accent);color:#fff8ef;text-decoration:none;
    font-size:14px;font-weight:600;letter-spacing:2px;padding:10px 0;border-radius:10px}
  .go:active{background:var(--accent-dark)}
  .book-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .book-actions .note{background:var(--accent-soft);color:var(--accent-dark)}
  .empty{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:28px;
    text-align:center;color:var(--ink3);font-size:13px;line-height:2}

  /* 活动热力图 */
  .hm-card{background:rgba(249,252,242,.86);border:1px solid #d5e3c7;border-radius:16px;padding:16px;overflow-x:auto}
  .hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
  .hm-cell{width:12px;height:12px;border-radius:3px;background:var(--hm0)}
  .hm-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;
    font-size:11px;color:var(--ink3)}
  .hm-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  details{margin-top:10px;font-size:12px;color:var(--ink2)}
  details summary{cursor:pointer;color:var(--ink3)}
  details table{margin-top:8px;border-collapse:collapse}
  details td,details th{border:1px solid var(--border);padding:3px 10px;font-weight:400}

  #tip{position:fixed;pointer-events:none;background:var(--ink);color:#f7f1e3;font-size:12px;
    padding:5px 9px;border-radius:7px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:9}

  footer{text-align:center;color:var(--ink3);font-size:11px;margin-top:36px;letter-spacing:1px}
  @media (max-width:560px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .shelf{grid-template-columns:1fr}
  }
</style>
<script src="/static/theme.js?v=40"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-title"><a class="back-shelf" href="/shelf.html" aria-label="返回书架"><i data-lucide="arrow-left"></i></a><h1 class="english-page-title"><span class="fox">🦊</span>Reading Record</h1></div>
    <span class="date-chip" id="today"></span>
  </header>

  <div class="stats">
    <div class="tile"><div class="num" id="st-time">–</div><div class="lbl">陪读时长</div></div>
    <div class="tile"><div class="num" id="st-sess">–</div><div class="lbl">共读会话</div></div>
    <div class="tile"><div class="num" id="st-msg">–</div><div class="lbl">对话条数</div></div>
    <div class="tile"><div class="num" id="st-mark">–</div><div class="lbl">摘录 · 书签</div></div>
  </div>

  <div class="shelf" id="shelf" hidden></div>

  <h2>阅读活动</h2>
  <div class="hm-card">
    <div class="hm-grid" id="hm"></div>
    <div class="hm-legend">少
      <i style="background:var(--hm0)"></i><i style="background:var(--hm1)"></i>
      <i style="background:var(--hm2)"></i><i style="background:var(--hm3)"></i>
      <i style="background:var(--hm4)"></i> 多
    </div>
    <details><summary>数据表</summary><table id="hm-table"></table></details>
  </div>

  <footer>小羊的书桌 · 福福看着呢 🦊</footer>
</div>
<div id="tip"></div>

<script>
const $ = id => document.getElementById(id);
const fmtDate = d => `${d.getMonth()+1}月${d.getDate()}日`;
$('today').textContent = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

const dayKey = ts => { const d=new Date(ts*1000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function fmtDur(sec){
  if(sec<60) return `<1<small>分钟</small>`;
  const h=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  return h>0 ? `${h}<small>时</small>${m}<small>分</small>` : `${m}<small>分钟</small>`;
}

function ring(pct){
  const r=24, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--ring-track)" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><div class="pct">${Math.round(pct*100)}%</div>`;
}

async function main(){
  let shelf=[], chat=[];
  try{
    const manifest=await (await fetch('/vault/manifest.json')).json();
    shelf=(manifest.books||[]).map(b=>({id:b.id,title:b.title||`《${b.id}》`,vault:true,chapters:b.chapters||[]}));
  }catch(e){}
  try{
    const allChat=await (await fetch('/api/read/chat')).json() || [];
    chat=allChat.filter(m=>String(m.book_id||'').startsWith('vault:'));
  }catch(e){}

  /* ---- 书架 ---- */
  const shelfEl = $('shelf');
  let totalMarks = 0;
  if(!shelf.length){
    shelfEl.innerHTML = `<div class="empty">深读书柜还空着<br>把书交给福福整理成章节，就能开始共读。</div>`;
  }
  for(const b of shelf){
    const card = document.createElement('div');
    card.className='book';

    if(b.vault){
      /* 深读书房的书：进度看章节活动，不看"页" */
      let chapters=[], hl=0;
      try{
        chapters = b.chapters || [];
      }catch(e){}
      try{
        const allHl = await (await fetch('/api/read/deep-highlights')).json();
        for(const k in allHl) if(k.startsWith(b.id+'/')) hl += (allHl[k]||[]).length;
      }catch(e){}
      totalMarks += hl;
      const msgs = chat.filter(m=>String(m.book_id||'').startsWith('vault:'+b.id+'/'));
      const activeCh = new Set(msgs.map(m=>(String(m.book_id).split('/')[1]||'')).filter(Boolean));
      const doneN = chapters.filter(c=>c.done).length;
      const readyN = chapters.filter(c=>c.ready).length;
      const touchedN = Math.max(doneN, activeCh.size);
      const pct = chapters.length ? Math.min(1, touchedN/chapters.length) : 0;
      const lastCh = chapters.filter(c=>activeCh.has(c.id)).pop();
      const lastTs = Math.max(b.uploaded_at||0, ...msgs.map(m=>m.ts||0));
      card.innerHTML = `
        <div class="book-top">
          <div class="ring">${ring(pct)}</div>
          <div>
            <div class="book-title">${b.title}</div>
            <div class="book-meta">${lastCh?('读到 <b>'+lastCh.title+'</b>'):'还没开读'} · 备读好 <b>${readyN}</b> 章</div>
          </div>
        </div>
        <div class="book-meta">🖍 划线 <b>${hl}</b> 条 · 💬 讨论 <b>${msgs.length}</b> 条<br>
        🕐 最近：${lastTs?fmtDate(new Date(lastTs*1000)):'—'}</div>
        <div class="book-actions">
          <a class="go" href="/read-deep.html?book=${encodeURIComponent(b.id)}">继续深读</a>
          <a class="go note" href="/book-notebook.html?id=${encodeURIComponent(b.id)}">这本的笔记</a>
        </div>`;
      shelfEl.appendChild(card);
      continue;
    }

  }
  $('st-mark').textContent = totalMarks;

  /* ---- 会话统计（按 30 分钟间隔切会话）---- */
  const ts = chat.map(m=>m.ts||0).filter(Boolean).sort((a,b)=>a-b);
  let sessions=0, dur=0, start=null, prev=null;
  for(const t of ts){
    if(prev===null || t-prev>1800){ if(start!==null) dur += (prev-start)+180; sessions++; start=t; }
    prev=t;
  }
  if(start!==null) dur += (prev-start)+180;
  $('st-sess').textContent = sessions;
  $('st-msg').textContent = chat.length;
  $('st-time').innerHTML = ts.length? fmtDur(dur) : '0';

  /* ---- 活动热力图：最近 18 周 ---- */
  const byDay = {};
  for(const t of ts) byDay[dayKey(t)] = (byDay[dayKey(t)]||0)+1;
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(today); end.setDate(end.getDate()+(6-end.getDay())); // 本周日
  const startD = new Date(end); startD.setDate(startD.getDate()-18*7+1);
  const tip = $('tip'); const hm = $('hm');
  const rows=[];
  for(let d=new Date(startD); d<=end; d.setDate(d.getDate()+1)){
    const k = dayKey(d.getTime()/1000), n = byDay[k]||0;
    const lvl = n===0?0 : n<=2?1 : n<=5?2 : n<=10?3 : 4;
    const cell = document.createElement('div');
    cell.className='hm-cell';
    cell.style.background = `var(--hm${lvl})`;
    if(d>today) cell.style.visibility='hidden';
    cell.dataset.label = `${fmtDate(d)} · ${n} 条对话`;
    hm.appendChild(cell);
    if(n>0) rows.push([k,n]);
  }
  hm.addEventListener('mousemove',e=>{
    const c=e.target.closest('.hm-cell');
    if(!c){tip.style.opacity=0;return}
    tip.textContent=c.dataset.label; tip.style.opacity=1;
    tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';
    tip.style.top=(e.clientY+14)+'px';
  });
  hm.addEventListener('mouseleave',()=>tip.style.opacity=0);
  hm.addEventListener('click',e=>{ // 手机上点一下也能看
    const c=e.target.closest('.hm-cell'); if(!c) return;
    tip.textContent=c.dataset.label; tip.style.opacity=1;
    tip.style.left=Math.min(e.touches?e.touches[0].clientX:e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';
    tip.style.top=((e.touches?e.touches[0].clientY:e.clientY)+14)+'px';
    setTimeout(()=>tip.style.opacity=0,1600);
  });
  $('hm-table').innerHTML = '<tr><th>日期</th><th>对话</th></tr>' +
    (rows.length? rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') : '<tr><td colspan="2">还没有记录</td></tr>');
}
main();
window.addEventListener('DOMContentLoaded',()=>renderCoreNav('study'));
</script>
</body>
</html>
