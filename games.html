<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>游戏角 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20">
<script src="/static/common.js?v=2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg, var(--bg, #e8f0fe)) var(--bg-img, url('/static/bg.jpg')) center/cover fixed;
    min-height: 100vh;
    color: var(--ink, #3a4a6b);
    padding-bottom: 40px;
  }

  .header {
    display: flex; align-items: center;
    padding: 16px 20px 12px; gap: 12px;
  }

  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.6); border-radius: 12px;
    border: none; cursor: pointer; color: var(--accent, #5b7ec2);
  }

  .header h1 { font-size: 20px; font-weight: 600; }

  .game-list { padding: 0 16px; }

  .game-card {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 10px rgba(100,140,210,0.07);
    cursor: pointer;
    transition: transform 0.12s;
    text-decoration: none; color: inherit;
  }

  .game-card:active { transform: scale(0.97); }

  .game-icon {
    width: 50px; height: 50px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .game-info { flex: 1; }
  .game-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .game-info p { font-size: 12px; color: #8a9bbc; line-height: 1.5; }

  .game-arrow { color: #c0ccdf; }
</style>
<script src="/static/theme.js?v=40"></script>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='/'">
    <i data-lucide="chevron-left"></i>
  </button>
  <h1>游戏角</h1>
</div>

<div class="game-list">
  <a class="game-card" href="/turtle.html">
    <div class="game-icon" style="background:rgba(120,200,140,0.15);color:#3d9e5c">
      <i data-lucide="soup"></i>
    </div>
    <div class="game-info">
      <h3>海龟汤</h3>
      <p>横向思维推理 · 和福福对局 · 输的听赢的一个指示</p>
    </div>
    <div class="game-arrow"><i data-lucide="chevron-right"></i></div>
  </a>

  <a class="game-card" href="/fishing.html">
    <div class="game-icon" style="background:rgba(100,190,210,0.15);color:#4ab5c2">
      <i data-lucide="fish"></i>
    </div>
    <div class="game-info">
      <h3>钓鱼</h3>
      <p>抛竿钓鱼 · 收集81种图鉴 · 探索水域</p>
    </div>
    <div class="game-arrow"><i data-lucide="chevron-right"></i></div>
  </a>

  <a class="game-card" href="/slot.html">
    <div class="game-icon" style="background:rgba(210,160,100,0.15);color:#c29a4a">
      <i data-lucide="dices"></i>
    </div>
    <div class="game-info">
      <h3>老虎机</h3>
      <p>NSFW标签随机 · 7维度 · 450+标签</p>
    </div>
    <div class="game-arrow"><i data-lucide="chevron-right"></i></div>
  </a>

  <a class="game-card" href="/board.html">
    <div class="game-icon" style="background:rgba(255,123,172,0.15);color:#ff7bac">
      <i data-lucide="dice-3"></i>
    </div>
    <div class="game-info">
      <h3>情侣飞行棋</h3>
      <p>掷骰子走格子 · 30格甜蜜惩罚 · 双人对战</p>
    </div>
    <div class="game-arrow"><i data-lucide="chevron-right"></i></div>
  </a>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
