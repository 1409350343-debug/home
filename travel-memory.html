<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云旅游记忆</title>
<link rel="stylesheet" href="/static/common.css?v=20"><script src="/static/common.js?v=2"></script>
<style>
body{margin:0;min-height:100vh;padding:22px;background:#dce7ed;color:#29445d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:800px;margin:auto}.head{display:flex;align-items:center;gap:12px;margin-bottom:20px}.head button{width:36px;height:36px;border:0;border-radius:11px;background:#fff}.head h1{margin:0;font-size:22px}.head small{display:block;color:#91a3b4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{display:block;padding:17px;border-radius:17px;background:rgba(255,255,255,.72);border:1px solid #fff;text-decoration:none;color:inherit;box-shadow:0 7px 22px rgba(40,65,87,.1)}.card small{color:#7994ad}.card h2{font-size:18px;margin:5px 0}.card p{font-size:12px;line-height:1.7;color:#61778c}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:9px;padding:3px 7px;border-radius:99px;background:#e7eef4;color:#65809a}
</style></head><body><main class="wrap"><header class="head"><button onclick="location.href='/memory.html'">‹</button><div><h1>云旅游</h1><small>AI 专题页与旅行记忆永久存放在这里</small></div></header><section class="grid" id="grid"></section></main>
<script>
const esc=HomeCommon.escapeHtml;
fetch('/data/travel/atlas.json').then(r=>r.json()).then(atlas=>{const ready=[];atlas.countries.forEach(c=>c.cities.filter(x=>x.ready).forEach(city=>ready.push({c,city})));grid.innerHTML=ready.map(({c,city})=>`<a class="card" href="/travel-city.html?country=${c.id}&city=${city.id}"><small>${esc(c.name_en)} · SAVED TOPIC</small><h2>${esc(city.name)} ${esc(city.name_en)}</h2><p>${esc(city.subtitle||'一座已经点亮的城市')}</p><div class="tags">${city.slides.map(s=>`<span class="tag">${esc(s.type)}</span>`).join('')}</div></a>`).join('')||'<p>还没有保存的城市专题。</p>'});
</script></body></html>
