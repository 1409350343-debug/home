<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Memory</title>
  <link rel="icon" href="/static/favicon-32.png">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/static/common.css?v=20">
  <link rel="stylesheet" href="/static/core-nav.css?v=14">
  <link rel="stylesheet" href="/static/memory-home.css?v=2">
  <script src="/static/common.js?v=2"></script>
  <script src="/static/core-nav.js?v=4"></script>
  <script src="/static/theme.js?v=40"></script>
</head>
<body>
<main class="memory-shell">
  <header class="memory-head">
    <div><small>our memory</small><h1 class="english-page-title">Memory</h1></div>
    <span id="generated">记忆系统</span>
  </header>

  <nav class="memory-tabs" aria-label="记忆页面">
    <button class="on" data-tab="bubbles"><i data-lucide="orbit"></i><span>记忆星图</span></button>
    <button data-tab="library"><i data-lucide="archive"></i><span>记忆库</span></button>
    <button data-tab="river"><i data-lucide="waves"></i><span>时间河流</span></button>
    <button data-tab="decay"><i data-lucide="sparkles"></i><span>记忆衰减</span></button>
  </nav>

  <section class="memory-view on" id="bubbles">
    <article class="heat-card glass">
      <div class="heat-copy"><b>记忆沉淀</b><small id="heatSummary">最近 12 周</small></div>
      <div class="compact-heat" id="compactHeat"></div>
      <div class="heat-legend"><span>少</span><i></i><i></i><i></i><i></i><span>多</span></div>
    </article>
    <article class="bubble-card glass">
      <div class="section-head">
        <div><b>记忆星图</b><small>每颗记忆星按重要程度、情绪和主题聚在一起</small></div>
        <span id="bubbleCount">0 条</span>
      </div>
      <div class="bubble-stage" id="bubbleStage">
        <svg id="relationLines" aria-hidden="true"></svg>
        <div class="empty">正在唤醒记忆……</div>
      </div>
      <p class="bubble-hint">点一颗记忆星，查看它与附近记忆的关系</p>
    </article>
  </section>

  <section class="memory-view" id="library">
    <div class="library-tools">
      <label class="search-box"><i data-lucide="search"></i><input id="search" placeholder="搜索标题、内容、标签或记录原因"></label>
      <a class="manage-link" href="/memory-archive.html"><i data-lucide="settings-2"></i><span>管理归档</span></a>
    </div>
    <div class="filter-row" id="filters"></div>
    <div class="library-results" id="results"></div>
  </section>

  <section class="memory-view" id="river">
    <article class="river-card glass">
      <div class="section-head">
        <div><b>时间河流</b><small>按发生时间，查看记忆如何一路沉淀下来</small></div>
        <span id="riverCount">0 个节点</span>
      </div>
      <div class="river" id="timeRiver"><div class="empty">正在整理时间……</div></div>
    </article>
  </section>

  <section class="memory-view" id="decay">
    <article class="decay-overview glass">
      <div class="section-head">
        <div><b>记忆衰减状态</b><small>观察哪些记忆仍然鲜活，哪些正在休眠</small></div>
        <span>只展示，不自动删除</span>
      </div>
      <div class="decay-summary" id="decaySummary"></div>
    </article>
    <div class="decay-list" id="decayList"><div class="empty">正在计算记忆强度……</div></div>
  </section>
</main>

<div class="drawer-mask" id="drawerMask"></div>
<aside class="memory-drawer" id="memoryDrawer" aria-hidden="true">
  <button class="drawer-close" id="drawerClose" aria-label="关闭"><i data-lucide="x"></i></button>
  <div class="drawer-kicker" id="drawerKicker">memory detail</div>
  <h2 id="drawerTitle">一条记忆</h2>
  <div class="drawer-meta" id="drawerMeta"></div>
  <div class="drawer-content" id="drawerContent"></div>
  <section class="drawer-reason"><small>为什么记住</small><p id="drawerReason">还没有写下原因</p></section>
  <section class="fact-evolution" id="factEvolution" hidden>
    <small>事实演化</small><div id="factVersions"></div>
  </section>
  <div class="drawer-tags" id="drawerTags"></div>
  <div class="drawer-actions">
    <a id="drawerCategory" href="/memory-archive.html"><i data-lucide="folder-cog"></i>分类管理</a>
    <a href="/memory-archive.html"><i data-lucide="archive"></i>归档管理</a>
  </div>
</aside>

<script src="/static/memory-home.js?v=2"></script>
</body>
</html>
