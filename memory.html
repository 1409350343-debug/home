<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>记忆角 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg, var(--bg, #e8f0fe)) var(--bg-img, url('/static/bg.jpg')) center/cover fixed;
    color: var(--ink, #3a4a6b);
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 0 0 env(safe-area-inset-bottom) 0;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 10px;
    gap: 12px;
    flex-shrink: 0;
  }

  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: var(--accent, #5b7ec2);
  }

  .header h1 {
    font-size: 20px;
    font-weight: 600;
  }

  .header .stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink3, #9aa8c7);
    background: rgba(255,255,255,0.5);
    padding: 4px 12px;
    border-radius: 12px;
  }

  .search-bar {
    margin: 0 16px 12px;
    position: relative;
    flex-shrink: 0;
  }

  .search-bar input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(20px);
    font-size: 14px;
    color: var(--ink, #3a4a6b);
    outline: none;
  }

  .search-bar input::placeholder { color: var(--line, #b0bdd4); }

  .search-bar .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink3, #9aa8c7);
    width: 16px;
    height: 16px;
  }

  .category-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 16px 16px;
    gap: 10px;
  }

  .category-card {
    flex: 1;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 12px rgba(100,140,210,0.08);
    display: flex;
    align-items: center;
    padding: 0 22px;
    gap: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    color: inherit;
  }

  .category-card:active {
    transform: scale(0.98);
    box-shadow: 0 1px 6px rgba(100,140,210,0.12);
  }

  .cat-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    flex-shrink: 0;
  }

  .cat-icon svg { width: 22px; height: 22px; }

  .cat-icon.ic-us { background: rgba(220,130,150,0.15); color: #c26b8a; }
  .cat-icon.ic-rules { background: rgba(139,170,230,0.15); color: var(--accent, #5b7ec2); }
  .cat-icon.ic-daily { background: rgba(240,180,80,0.15); color: #c49a4a; }
  .cat-icon.ic-milestones { background: rgba(240,200,80,0.15); color: #c4a030; }
  .cat-icon.ic-secret { background: rgba(170,140,210,0.15); color: #8a6ec2; }

  .cat-info { flex: 1; min-width: 0; }
  .cat-info h3 { font-size: 16px; font-weight: 600; }
  .cat-info p { font-size: 12px; color: var(--ink3, #9aa8c7); margin-top: 2px; }

  .cat-count {
    font-size: 13px;
    color: var(--ink3, #9aa8c7);
    background: rgba(100,140,210,0.08);
    padding: 3px 12px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .cat-arrow {
    color: #c0ccdf;
    flex-shrink: 0;
  }

  .cat-arrow svg { width: 18px; height: 18px; }

  /* Search overlay */
  .search-results {
    flex: 1;
    padding: 0 16px 16px;
    display: none;
    overflow-y: auto;
  }

  .search-results.open { display: block; }

  .search-result-item {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.9);
    cursor: pointer;
  }

  .search-result-item:active { background: rgba(255,255,255,0.9); }

  .sr-category {
    font-size: 10px;
    color: #8a6ec2;
    background: rgba(170,140,210,0.12);
    padding: 1px 8px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }

  .sr-content {
    font-size: 13px;
    color: #4a5a7b;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--line, #b0bdd4);
    font-size: 14px;
  }

  /* Detail modal (for search results) */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(4px);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px 20px;
    animation: slideUp 0.25s ease-out;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-content {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink, #3a4a6b);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .modal-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .modal-tag {
    font-size: 11px;
    background: rgba(100,140,210,0.1);
    color: var(--accent, #5b7ec2);
    padding: 3px 10px;
    border-radius: 8px;
  }

  .modal-meta {
    margin-top: 12px;
    font-size: 11px;
    color: var(--line, #b0bdd4);
  }
</style>
<script src="/static/theme.js?v=32"></script>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='/'">
    <i data-lucide="chevron-left"></i>
  </button>
  <h1>记忆角</h1>
  <div class="stats" id="totalStats">-</div>
</div>

<div class="search-bar">
  <i data-lucide="search" class="search-icon"></i>
  <input type="text" id="searchInput" placeholder="搜索记忆..." oninput="onSearch(this.value)">
</div>

<div class="search-results" id="searchResults"></div>

<div class="category-list" id="categoryList"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-content" id="modalContent"></div>
    <div class="modal-tags" id="modalTags"></div>
    <div class="modal-meta" id="modalMeta"></div>
  </div>
</div>

<script>
const CAT_ICONS = {
  us: 'heart', rules: 'book-open', daily: 'sun',
  milestones: 'star', secret: 'lock'
};

const CAT_NAMES = {};
let allData = null;
let searchTimer = null;

async function loadMemories() {
  try {
    const res = await fetch('/api/memory');
    allData = await res.json();

    allData.categories.forEach(c => { CAT_NAMES[c.id] = c.name; });

    const total = Object.values(allData.memories).reduce((s, m) => s + m.length, 0);
    document.getElementById('totalStats').textContent = total + ' 条记忆';

    renderCategories(allData);
  } catch (e) {
    document.getElementById('categoryList').innerHTML =
      '<div class="empty-state">加载失败，请刷新重试</div>';
  }
}

function renderCategories(data) {
  const el = document.getElementById('categoryList');
  el.innerHTML = '';

  data.categories.forEach(cat => {
    const mems = data.memories[cat.id] || [];
    const card = document.createElement('a');
    card.className = 'category-card';
    card.href = '/memory-cat.html?cat=' + cat.id;

    card.innerHTML = `
      <div class="cat-icon ic-${cat.id}">
        <i data-lucide="${CAT_ICONS[cat.id] || 'folder'}"></i>
      </div>
      <div class="cat-info">
        <h3>${cat.name}</h3>
        <p>${cat.desc}</p>
      </div>
      <span class="cat-count">${mems.length}</span>
      <div class="cat-arrow">
        <i data-lucide="chevron-right"></i>
      </div>
    `;

    el.appendChild(card);
  });

  lucide.createIcons();
}

function showDetail(m) {
  document.getElementById('modalContent').textContent = m.content;
  const tagsEl = document.getElementById('modalTags');
  tagsEl.innerHTML = (m.tags || []).map(t => `<span class="modal-tag">${t}</span>`).join('');
  const meta = [];
  if (m.created) meta.push('创建: ' + m.created.slice(0, 10));
  if (m.last_active) meta.push('活跃: ' + m.last_active.slice(0, 10));
  if (m.type) meta.push(m.type === 'permanent' ? '永久' : '动态');
  document.getElementById('modalMeta').textContent = meta.join(' · ');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

function onSearch(q) {
  clearTimeout(searchTimer);
  const catList = document.getElementById('categoryList');
  const srList = document.getElementById('searchResults');

  if (!q.trim()) {
    srList.classList.remove('open');
    catList.style.display = '';
    return;
  }

  searchTimer = setTimeout(async () => {
    try {
      const res = await fetch('/api/memory/search?q=' + encodeURIComponent(q));
      const data = await res.json();

      catList.style.display = 'none';
      srList.classList.add('open');

      if (data.results.length === 0) {
        srList.innerHTML = '<div class="empty-state">没有找到相关记忆</div>';
        return;
      }

      srList.innerHTML = data.results.map(r => `
        <div class="search-result-item" onclick='showDetail(${JSON.stringify(r).replace(/'/g, "&#39;")})'>
          <span class="sr-category">${CAT_NAMES[r.category] || r.category}</span>
          <div class="sr-content">${escHtml(r.content.slice(0, 150))}</div>
        </div>
      `).join('');
    } catch (e) {
      srList.innerHTML = '<div class="empty-state">搜索出错</div>';
    }
  }, 300);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadMemories();
</script>
</body>
</html>
