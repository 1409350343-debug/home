<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>和福福聊天</title>
<link rel="stylesheet" href="/static/common.css?v=20">
<script src="/static/common.js?v=2"></script>
<script src="/static/chat-client.js?v=1"></script>
<style>
  @font-face{font-family:'Yozai';src:url('/static/yozai.woff2') format('woff2');font-display:swap}
  :root{
    --bg:#faf5d8; --card:#fffdee; --card2:#f5f4d7;
    --ink:#496653; --ink2:#6f856f; --ink3:#98a98f;
    --accent:#88ad73; --deep:#658b59; --soft:#e7efcf; --line:#dce8cf;
  }
  html,body{height:100%}
  body{background:#f8f1df url('/static/summer-green-background.png') center bottom/cover fixed;color:var(--ink);display:flex;flex-direction:column;
    font-family:'Yozai',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top));
    background:rgba(255,253,238,0.78);backdrop-filter:blur(24px) saturate(1.35);
    -webkit-backdrop-filter:blur(24px) saturate(1.35);border-bottom:1px solid rgba(255,255,255,0.66)}
  header a{color:var(--ink2);text-decoration:none;font-size:18px}
  header .t{flex:1}
  header .t b{font-size:16px;display:block}
  header .t small{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px;line-height:1.5}
  .line-dot{width:7px;height:7px;border-radius:50%;background:#96a8ba;box-shadow:0 0 0 3px rgba(150,168,186,.14);flex:none}
  .line-dot.ok{background:#58a879;box-shadow:0 0 0 3px rgba(88,168,121,.14)}
  .line-dot.wait{background:#d99b3d;box-shadow:0 0 0 3px rgba(217,155,61,.14);animation:pulse 1.8s ease-in-out infinite}
  .line-dot.off{background:#c96a6a;box-shadow:0 0 0 3px rgba(201,106,106,.14)}
  @keyframes pulse{50%{opacity:.48;transform:scale(.82)}}
  header .ava{width:44px;height:44px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line);flex:none;background:var(--card2)}
  #msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch}
  .msg{max-width:80%;display:flex;gap:8px;align-items:flex-end}
  .msg .col{display:flex;flex-direction:column;gap:4px;min-width:0}
  .msg .bub{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.9;
    white-space:pre-wrap;word-break:break-word}
  .msg .bub img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
  .msg .meta{font-size:10px;color:var(--ink3);padding:0 4px}
  .msg .delivery{cursor:default}
  .msg .delivery.failed{color:#b84e55;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .msg.pending .bub{opacity:.76}
  .msg .avm{width:36px;height:36px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line);flex:none;background:var(--card2)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .col{align-items:flex-end}
  .msg.me .bub{background:linear-gradient(160deg,#a8c691,#88ad73);color:#fffef7;border-bottom-right-radius:4px}
  .msg.fox{align-self:flex-start}
  .msg.fox .col{align-items:flex-start}
  .msg.fox .bub{background:rgba(255,253,238,0.82);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.7);border-bottom-left-radius:4px}
  .ctx{font-size:10px;color:var(--ink3);align-self:center;background:var(--card2);
    border-radius:99px;padding:3px 10px}
  #bar{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,253,238,0.78);backdrop-filter:blur(24px) saturate(1.35);
    -webkit-backdrop-filter:blur(24px) saturate(1.35);border-top:1px solid rgba(255,255,255,0.66);align-items:flex-end}
  #bar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
    background:var(--card2);color:var(--ink);font-size:14px;line-height:1.6;padding:9px 12px;
    max-height:110px;font-family:inherit;outline:none}
  #bar button{flex:none;border:none;border-radius:12px;font-size:15px;cursor:pointer;padding:10px 14px}
  #send{background:var(--accent);color:#fff}
  #send:disabled,#pic:disabled{opacity:.52;cursor:wait}
  #pic{background:var(--card2);border:1px solid var(--line)!important;color:var(--ink2)}
  .image-missing{display:inline-flex;padding:5px 9px;border-radius:9px;background:#edf4df;color:var(--ink2);font-size:11px}
</style>
</head>
<body>
<header>
  <a href="/">‹</a>
  <div style="display:flex;flex:none">
    <img class="ava" src="/static/img/fufu/portrait.jpg?v=2" alt="福福">
    <img class="ava" src="/static/avatar-xiaoyang.jpg" alt="小羊" style="margin-left:-14px;z-index:-1;position:relative">
  </div>
  <div class="t"><b>福福 & 小羊</b><small><span class="line-dot" id="line-dot"></span><span id="line-status">正在连接小窝…</span></small></div>
  <a href="/settings.html" id="gear" style="font-size:16px" aria-label="打开设置">⚙️</a>
</header>
<div id="msgs"></div>
<div id="bar">
  <button id="pic">🖼️</button>
  <textarea id="txt" rows="1" placeholder="说点什么…"></textarea>
  <button id="send">发送</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<script src="/static/theme.js?v=41"></script>
<script>
const $=id=>document.getElementById(id);
let lastTs=0, seen=new Set(), latestHome=[], pollBusy=false, routeStatus=null, lastStatusCheck=0;
const esc=HomeChat.escapeHtml;
const T=ts=>new Date(ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
const safeImg=src=>{
  try{
    const u=new URL(src,location.origin);
    return (u.origin===location.origin||u.protocol==='blob:')?u.href:'';
  }catch(e){return '';}
};
const clientId=HomeChat.clientId;

function setLine(kind,text){
  $('line-dot').className='line-dot '+kind;
  $('line-status').textContent=text;
}
function relativeTime(ts){
  const sec=Math.max(0,Date.now()/1000-ts);
  if(sec<60)return '刚刚';
  if(sec<3600)return Math.floor(sec/60)+' 分钟前';
  if(sec<86400)return Math.floor(sec/3600)+' 小时前';
  return Math.floor(sec/86400)+' 天前';
}
function updateLine(){
  const home=latestHome.filter(m=>(m.book_id||'home')==='home');
  const mine=[...home].reverse().find(m=>m.sender==='小羊');
  const fox=[...home].reverse().find(m=>m.sender!=='小羊');
  if(routeStatus&&routeStatus.cc_status_known){
    if(routeStatus.cc_online){
      setLine(routeStatus.waiting?'wait':'ok',routeStatus.waiting?'CC 在线 · 已收到小窝消息':'CC 在线 · TG 通道保持联通');
    }else{
      setLine('off','CC 心跳已中断 · TG/CC 通道可能离线');
    }
    return;
  }
  if(mine&&(!fox||(mine.ts||0)>(fox.ts||0))){
    const waited=Date.now()/1000-(mine.ts||0);
    setLine('wait',waited>120?'已等待 '+relativeTime(mine.ts)+' · CC 状态未知':'消息已存入小窝 · 等待福福查看');
  }else if(fox){
    setLine('ok','小窝线路可达 · 福福 '+relativeTime(fox.ts)+'回复');
  }else{
    setLine('ok','小窝线路可达 · 等你说话');
  }
}
async function refreshRouteStatus(){
  if(Date.now()-lastStatusCheck<5000)return;
  lastStatusCheck=Date.now();
  try{
    routeStatus=await HomeChat.jsonRequest('/api/read/chat-status');
  }catch(e){
    routeStatus=null;
  }
}

function ctxLabel(bid){
  if(!bid||bid==='home')return '';
  return '📖';
}
function add(m,localState){
  if(!localState&&seen.has(m.id))return null;
  if(!localState)seen.add(m.id);
  const me=m.sender==='小羊';
  const el=document.createElement('div');
  el.className='msg '+(me?'me':'fox')+(localState?' pending':'');
  const ctx=ctxLabel(m.book_id);
  const av=me?`<img class="avm" src="/static/avatar-xiaoyang.jpg" alt="小羊">`
            :`<img class="avm" src="/static/img/fufu/portrait.jpg?v=2" alt="福福">`;
  const img=safeImg(m.img);
  const delivery=me?`<span class="delivery">${localState||' · 已存入小窝'}</span>`:'';
  el.innerHTML=`${av}<div class="col"><div class="bub">${img?`<img src="${img}" alt="聊天图片">`:''}${img&&m.text?'<br>':''}${esc(m.text)}</div>
    <div class="meta">${T(m.ts)}${ctx?' '+ctx:''}${delivery}</div></div>`;
  const chatImage=el.querySelector('.bub img');
  chatImage?.addEventListener('error',()=>{
    const note=document.createElement('span');
    note.className='image-missing';
    note.textContent='旧图片未同步';
    chatImage.replaceWith(note);
  },{once:true});
  $('msgs').appendChild(el);
  return el;
}
function scrollBottom(){ $('msgs').scrollTop=$('msgs').scrollHeight; }

async function poll(first){
  if(pollBusy)return;
  pollBusy=true;
  try{
    const response=await fetch('/api/read/chat?since='+lastTs,{cache:'no-store'});
    if(!response.ok)throw new Error('line unavailable');
    const msgs=await response.json();
    let added=false;
    for(const m of msgs){
      if(!latestHome.some(x=>x.id===m.id))latestHome.push(m);
      if(add(m)){added=true;}
      if(m.ts>lastTs)lastTs=m.ts;
    }
    latestHome=latestHome.slice(-500);
    await refreshRouteStatus();
    updateLine();
    if(added&&(first||$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<160))scrollBottom();
  }catch(e){
    setLine('off','小窝线路未连接 · 消息暂时无法送达');
  }finally{
    pollBusy=false;
  }
}

function markFailed(el,retry){
  el.classList.remove('pending');
  const status=el.querySelector('.delivery');
  status.textContent=' · 发送失败，点这里重试';
  status.classList.add('failed');
  status.onclick=retry;
  setLine('off','发送失败 · 可以点击消息下方重试');
}
async function postText(t,el,id){
  const status=el.querySelector('.delivery');
  el.classList.add('pending');
  status.classList.remove('failed');
  status.textContent=' · 发送中';
  status.onclick=null;
  try{
    const response=await fetch('/api/read/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,sender:'小羊',page:-1,book_id:'home',client_id:id})});
    if(!response.ok)throw new Error('send failed');
    const r=await response.json();
    if(!r.msg)throw new Error('missing message');
    el.remove();
    latestHome.push(r.msg);
    add(r.msg); updateLine(); scrollBottom();
  }catch(e){markFailed(el,()=>postText(t,el,id));}
}
function send(){
  const t=$('txt').value.trim(); if(!t)return;
  $('txt').value=''; $('txt').style.height='auto';
  const el=add({sender:'小羊',text:t,book_id:'home',ts:Date.now()/1000},' · 发送中');
  scrollBottom();
  postText(t,el,clientId());
}
$('send').onclick=send;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('txt').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px';});
$('pic').onclick=()=>$('file').click();
$('file').onchange=async function(){
  if(!this.files[0])return;
  const file=this.files[0], text=$('txt').value.trim(), preview=URL.createObjectURL(file), id=clientId();
  const el=add({sender:'小羊',text,img:preview,book_id:'home',ts:Date.now()/1000},' · 图片上传中');
  scrollBottom();
  $('txt').value='';
  const upload=async()=>{
    const fd=new FormData();
    fd.append('file',file); fd.append('sender','小羊'); fd.append('book_id','home');
    fd.append('text',text); fd.append('client_id',id);
    const status=el.querySelector('.delivery');
    el.classList.add('pending'); status.classList.remove('failed');
    status.textContent=' · 图片上传中'; status.onclick=null;
  try{
      const response=await fetch('/api/read/chat-image',{method:'POST',body:fd});
      if(!response.ok)throw new Error('upload failed');
      const r=await response.json();
      if(!r.msg)throw new Error('missing message');
      el.remove(); URL.revokeObjectURL(preview);
      latestHome.push(r.msg);
      add(r.msg); updateLine(); scrollBottom();
    }catch(e){markFailed(el,upload);}
  };
  upload();
  this.value='';
};
poll(true).then(scrollBottom);
setInterval(poll,2500);
</script>
</body>
</html>
