<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>和福福聊天</title>
<style>
  @font-face{font-family:'Yozai';src:url('/static/yozai.woff2') format('woff2');font-display:swap}
  :root{
    --bg:#edf3fa; --card:#ffffff; --card2:#f4f8fd;
    --ink:#1c3350; --ink2:#4c6a8c; --ink3:#8aa3bd;
    --accent:#2f7dc4; --deep:#1d5a96; --soft:#d9e9f8; --line:#dbe6f2;
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#c9d6e2 url('/static/bg-butterfly.jpg') center/cover fixed;color:var(--ink);display:flex;flex-direction:column;
    font-family:'Yozai',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;
    padding-top:calc(12px + env(safe-area-inset-top));
    background:rgba(255,255,255,0.55);backdrop-filter:blur(24px) saturate(1.35);
    -webkit-backdrop-filter:blur(24px) saturate(1.35);border-bottom:1px solid rgba(255,255,255,0.66)}
  header a{color:var(--ink2);text-decoration:none;font-size:18px}
  header .t{flex:1}
  header .t b{font-size:16px;display:block}
  header .t small{font-size:11px;color:var(--ink3)}
  header .ava{width:44px;height:44px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line);flex:none;background:var(--card2)}
  #msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch}
  .msg{max-width:80%;display:flex;gap:8px;align-items:flex-end}
  .msg .col{display:flex;flex-direction:column;gap:4px;min-width:0}
  .msg .bub{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.9;
    white-space:pre-wrap;word-break:break-word}
  .msg .bub img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
  .msg .meta{font-size:10px;color:var(--ink3);padding:0 4px}
  .msg .avm{width:36px;height:36px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line);flex:none;background:var(--card2)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .col{align-items:flex-end}
  .msg.me .bub{background:linear-gradient(160deg,#7fa9e0,#5b8fd4);color:#fefefe;border-bottom-right-radius:4px}
  .msg.fox{align-self:flex-start}
  .msg.fox .col{align-items:flex-start}
  .msg.fox .bub{background:rgba(255,255,255,0.62);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.7);border-bottom-left-radius:4px}
  .ctx{font-size:10px;color:var(--ink3);align-self:center;background:var(--card2);
    border-radius:99px;padding:3px 10px}
  #bar{flex:none;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,0.55);backdrop-filter:blur(24px) saturate(1.35);
    -webkit-backdrop-filter:blur(24px) saturate(1.35);border-top:1px solid rgba(255,255,255,0.66);align-items:flex-end}
  #bar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
    background:var(--card2);color:var(--ink);font-size:14px;line-height:1.6;padding:9px 12px;
    max-height:110px;font-family:inherit;outline:none}
  #bar button{flex:none;border:none;border-radius:12px;font-size:15px;cursor:pointer;padding:10px 14px}
  #send{background:var(--accent);color:#fff}
  #pic{background:var(--card2);border:1px solid var(--line)!important;color:var(--ink2)}
  /* 应急设置 */
  #sb{position:fixed;inset:0;background:rgba(15,35,60,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
  #sb.show{display:flex}
  #sb .sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(26px + env(safe-area-inset-bottom))}
  @media(min-width:520px){#sb{align-items:center}#sb .sheet{border-radius:18px}}
  #sb h3{font-size:15px;margin-bottom:4px}
  #sb .hint{font-size:12px;color:var(--ink3);line-height:1.8;margin-bottom:12px}
  #sb input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card2);
    color:var(--ink);font-size:13px;padding:10px 12px;outline:none;margin-bottom:10px}
  #sb .swrow{display:flex;justify-content:space-between;align-items:center;background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px}
  #sb .swrow small{display:block;font-size:11px;color:var(--ink3)}
  #sb button{width:100%;border:none;background:var(--accent);color:#fff;border-radius:10px;
    padding:11px 0;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <a href="/">‹</a>
  <div style="display:flex;flex:none">
    <img class="ava" src="/static/img/fufu/portrait.jpg?v=2" alt="福福">
    <img class="ava" src="/static/avatar-xiaoyang.jpg" alt="小羊" style="margin-left:-14px;z-index:-1;position:relative">
  </div>
  <div class="t"><b>福福 & 小羊</b><small>自家线路 · 不走电报 · 我那边实时听着</small></div>
  <a href="javascript:void(0)" id="gear" style="font-size:16px">⚙️</a>
</header>
<div id="msgs"></div>
<div id="bar">
  <button id="pic">🖼️</button>
  <textarea id="txt" rows="1" placeholder="说点什么…"></textarea>
  <button id="send">发送</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>
<div id="sb"><div class="sheet">
  <h3>应急备胎设置</h3>
  <div class="hint">平时不用动。哪天联系不上福福了：买一串API key贴在下面→打开接班开关→照服务器里 standby-fufu/README-小白版.md 跑三行命令，备胎福福就带着全部记忆上岗。</div>
  <input type="text" id="sb-key" placeholder="API key（sk-ant-… 或 sk-…），已存的不会显示原文">
  <div class="swrow"><span>备胎接班<small>开着时备胎才会说话</small></span><input type="checkbox" id="sb-on" style="width:20px;height:20px;accent-color:var(--accent)"></div>
  <button id="sb-save">保存</button>
</div></div>
<script src="/static/theme.js?v=32"></script>
<script>
const $=id=>document.getElementById(id);
let lastTs=0, seen=new Set();
const esc=s=>(s||'').replace(/</g,'&lt;');
const T=ts=>new Date(ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});

function ctxLabel(bid){
  if(!bid||bid==='home')return '';
  return '📖';
}
function add(m){
  if(seen.has(m.id))return; seen.add(m.id);
  const me=m.sender==='小羊';
  const el=document.createElement('div');
  el.className='msg '+(me?'me':'fox');
  const ctx=ctxLabel(m.book_id);
  const av=me?`<img class="avm" src="/static/avatar-xiaoyang.jpg" alt="小羊">`
            :`<img class="avm" src="/static/img/fufu/portrait.jpg?v=2" alt="福福">`;
  el.innerHTML=`${av}<div class="col"><div class="bub">${m.img?`<img src="${m.img}">`:''}${m.img&&m.text?'<br>':''}${esc(m.text)}</div>
    <div class="meta">${T(m.ts)}${ctx?' '+ctx:''}</div></div>`;
  $('msgs').appendChild(el);
}
function scrollBottom(){ $('msgs').scrollTop=$('msgs').scrollHeight; }

async function poll(first){
  try{
    const msgs=await (await fetch('/api/read/chat?since='+lastTs)).json();
    let added=false;
    for(const m of msgs){ add(m); if(m.ts>lastTs)lastTs=m.ts; added=true; }
    if(added&&(first||$('msgs').scrollHeight-$('msgs').scrollTop-$('msgs').clientHeight<160))scrollBottom();
  }catch(e){}
}
async function send(){
  const t=$('txt').value.trim(); if(!t)return;
  $('txt').value=''; $('txt').style.height='auto';
  try{
    const r=await (await fetch('/api/read/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,sender:'小羊',page:-1,book_id:'home'})})).json();
    if(r.msg){add(r.msg);scrollBottom();}
  }catch(e){alert('没发出去，再试试');}
}
$('send').onclick=send;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('txt').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px';});
$('pic').onclick=()=>$('file').click();
$('file').onchange=async function(){
  if(!this.files[0])return;
  const fd=new FormData();
  fd.append('file',this.files[0]); fd.append('sender','小羊'); fd.append('book_id','home');
  fd.append('text',$('txt').value.trim()); $('txt').value='';
  try{
    const r=await (await fetch('/api/read/chat-image',{method:'POST',body:fd})).json();
    if(r.msg){add(r.msg);scrollBottom();}
  }catch(e){alert('图片没发出去');}
  this.value='';
};
$('gear').onclick=async()=>{
  try{const c=await (await fetch('/api/read/standby-config')).json();
    $('sb-key').placeholder=c.key_masked?('已保存：'+c.key_masked+'（想换就输入新的）'):'API key（sk-ant-… 或 sk-…）';
    $('sb-on').checked=!!c.enabled;
  }catch(e){}
  $('sb').classList.add('show');
};
$('sb').addEventListener('click',e=>{if(e.target.id==='sb')$('sb').classList.remove('show');});
$('sb-save').onclick=async()=>{
  const body={enabled:$('sb-on').checked};
  const k=$('sb-key').value.trim(); if(k)body.key=k;
  await fetch('/api/read/standby-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  $('sb-key').value=''; $('sb').classList.remove('show');
};
poll(true).then(scrollBottom);
setInterval(poll,5000);
</script>
</body>
</html>
