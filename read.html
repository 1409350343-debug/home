<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>共读 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: var(--bg, #e8f0fe); --card: rgba(255,255,255,0.85); --text: var(--ink, #3a4a6b);
    --sub: var(--ink3, #9aa8c7); --accent: var(--accent, #5b7ec2); --accent-light: rgba(91,126,194,0.15);
    --hl-user: rgba(255,213,79,0.35); --hl-ai: rgba(147,197,253,0.35);
    --border: rgba(255,255,255,0.9); --shadow: rgba(100,140,210,0.08);
  }
  body.night {
    --bg: #1a1a2e; --card: rgba(30,30,50,0.9); --text: #c8cdd8;
    --sub: #6b7394; --accent: #8aaee0; --accent-light: rgba(138,174,224,0.15);
    --hl-user: rgba(255,213,79,0.25); --hl-ai: rgba(147,197,253,0.2);
    --border: rgba(50,50,70,0.8); --shadow: rgba(0,0,0,0.3);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); min-height: 100vh; color: var(--text);
    transition: background .3s, color .3s;
  }
  body.night { background-image: none; }
  body:not(.night) { background-image: url('/static/bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }

  .header {
    display: flex; align-items: center; padding: 16px 20px 12px; gap: 12px;
    position: sticky; top: 0; z-index: 50;
    background: var(--card); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .hbtn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; background: var(--accent-light);
    border-radius: 12px; border: none; cursor: pointer; color: var(--accent);
    transition: all .15s;
  }
  .hbtn:active { transform: scale(0.92); }
  .header h1 { font-size: 18px; font-weight: 600; flex: 1; }
  .header .tools { display: flex; gap: 8px; }

  /* ---- shelf view ---- */
  .shelf { padding: 16px; }
  .shelf-title { font-size: 12px; color: var(--sub); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; padding: 0 4px; }
  .upload-zone {
    background: var(--card); backdrop-filter: blur(20px); border-radius: 16px;
    padding: 32px 20px; text-align: center; margin-bottom: 16px;
    border: 2px dashed var(--accent); color: var(--accent); cursor: pointer;
    transition: all .15s;
  }
  .upload-zone:active { transform: scale(0.98); }
  .upload-zone i { margin-bottom: 8px; }
  .upload-zone p { font-size: 13px; margin-top: 4px; }
  #file-input { display: none; }
  .book-card {
    background: var(--card); backdrop-filter: blur(20px); border-radius: 16px;
    padding: 16px 20px; margin-bottom: 10px;
    border: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow);
    display: flex; align-items: center; cursor: pointer; transition: transform .12s;
  }
  .book-card:active { transform: scale(0.98); }
  .book-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--accent-light); color: var(--accent); margin-right: 14px; flex-shrink: 0; }
  .book-info { flex: 1; }
  .book-info h3 { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .book-info p { font-size: 12px; color: var(--sub); }
  .book-progress { font-size: 11px; color: var(--sub); margin-left: 8px; white-space: nowrap; }
  .book-del { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: #d06; border: none; background: none; cursor: pointer; margin-left: 6px; border-radius: 8px; }
  .book-del:active { background: rgba(220,0,100,0.1); }

  /* ---- reader view ---- */
  .reader { display: none; flex-direction: column; min-height: 100vh; }
  .reader.active { display: flex; }
  .shelf.hidden { display: none; }
  .reader-body {
    flex: 1; padding: 20px 20px 80px; max-width: 640px; margin: 0 auto; width: 100%;
  }
  .page-content {
    background: var(--card); backdrop-filter: blur(20px); border-radius: 16px;
    padding: 24px 22px; border: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow);
    font-size: 16px; line-height: 1.85; white-space: pre-wrap; word-break: break-word;
    min-height: 300px; user-select: text; position: relative;
  }
  .page-content .hl-user { background: var(--hl-user); border-radius: 3px; cursor: pointer; }
  .page-content .hl-ai { background: var(--hl-ai); border-radius: 3px; cursor: pointer; }
  .reader-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border); padding: 10px 20px env(safe-area-inset-bottom, 10px);
    display: flex; align-items: center; justify-content: center; gap: 16px; z-index: 50;
  }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 12px; border: none;
    background: var(--accent-light); color: var(--accent); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .12s;
  }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:active:not(:disabled) { transform: scale(0.9); }
  .page-info { font-size: 13px; color: var(--sub); min-width: 80px; text-align: center; }
  .progress-bar {
    flex: 1; max-width: 120px; height: 4px; background: var(--accent-light);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }

  /* ---- highlight toolbar ---- */
  .hl-toolbar {
    display: none; position: absolute; z-index: 100;
    background: var(--card); backdrop-filter: blur(20px);
    border-radius: 12px; padding: 6px; gap: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); border: 1px solid var(--border);
  }
  .hl-toolbar.show { display: flex; }
  .hl-toolbar button {
    border: none; border-radius: 8px; padding: 6px 12px;
    font-size: 12px; cursor: pointer; transition: all .12s;
  }
  .hl-toolbar .hl-user-btn { background: var(--hl-user); color: var(--text); }
  .hl-toolbar .hl-ai-btn { background: var(--hl-ai); color: var(--text); }
  .hl-toolbar button:active { transform: scale(0.92); }

  /* ---- search panel ---- */
  .search-panel {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 200; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
  }
  .search-panel.show { display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
  .search-box {
    background: var(--card); border-radius: 16px; padding: 16px; width: 90%; max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2); border: 1px solid var(--border);
  }
  .search-box input {
    width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--accent-light); color: var(--text); font-size: 14px; outline: none;
  }
  .search-results { margin-top: 10px; max-height: 300px; overflow-y: auto; }
  .search-results .sr {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
    color: var(--sub); margin-bottom: 4px; transition: background .12s;
  }
  .search-results .sr:active { background: var(--accent-light); }
  .search-results .sr b { color: var(--accent); }

  /* ---- bookmark list ---- */
  .bm-panel {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 200; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
  }
  .bm-panel.show { display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
  .bm-box {
    background: var(--card); border-radius: 16px; padding: 16px; width: 90%; max-width: 400px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2); border: 1px solid var(--border);
  }
  .bm-box h3 { font-size: 15px; margin-bottom: 10px; color: var(--accent); }
  .bm-list { max-height: 300px; overflow-y: auto; }
  .bm-item {
    padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px; transition: background .12s;
  }
  .bm-item:active { background: var(--accent-light); }

  /* font size controls */
  .font-controls { display: flex; align-items: center; gap: 6px; }
  .font-controls button { width: 28px; height: 28px; border-radius: 8px; border: none; background: var(--accent-light); color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  /* legend */
  .legend { display: flex; gap: 12px; justify-content: center; margin-top: 12px; font-size: 11px; color: var(--sub); }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 12px; height: 6px; border-radius: 3px; }
  .legend .dot-user { background: var(--hl-user); }
  .legend .dot-ai { background: var(--hl-ai); }

  /* ---- chat panel ---- */
  .chat-toggle {
    position: fixed; bottom: 70px; right: 16px; z-index: 60;
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 4px 15px rgba(91,126,194,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .chat-toggle:active { transform: scale(0.9); }
  .chat-toggle .badge {
    position: absolute; top: -2px; right: -2px;
    background: #e74c3c; color: #fff; font-size: 10px;
    width: 18px; height: 18px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  .chat-panel {
    display: none; position: fixed; bottom: 70px; right: 16px; left: 16px;
    z-index: 150; max-width: 400px;
    background: var(--card); backdrop-filter: blur(20px);
    border-radius: 16px; border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    flex-direction: column; height: 55vh; max-height: 420px;
  }
  .chat-panel.show { display: flex; }
  .chat-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header h3 { font-size: 14px; color: var(--accent); }
  .chat-header button { background: none; border: none; color: var(--sub); cursor: pointer; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .chat-msg {
    max-width: 85%; padding: 8px 12px; border-radius: 12px;
    font-size: 13px; line-height: 1.5; word-break: break-word;
  }
  .chat-msg.me {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.other {
    align-self: flex-start; background: var(--accent-light); color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .chat-msg .msg-meta { font-size: 10px; opacity: 0.6; margin-top: 2px; }
  .chat-input-row {
    padding: 10px 12px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .chat-input-row input {
    flex: 1; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--accent-light);
    color: var(--text); font-size: 13px; outline: none;
  }
  .chat-input-row button {
    padding: 8px 14px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    font-size: 13px; white-space: nowrap;
  }
  .chat-input-row button:active { opacity: 0.8; }
  @media (min-width: 500px) {
    .chat-panel { left: auto; right: 16px; width: 380px; }
  }
</style>
<script src="/static/theme.js?v=32"></script>
</head>
<body>

<!-- Shelf View -->
<div class="shelf" id="shelf-view">
  <div class="header" style="position:relative; background:transparent; border:none; padding: 16px 4px 12px;">
    <button class="hbtn" onclick="location.href='/'"><i data-lucide="arrow-left" style="width:18px;height:18px"></i></button>
    <h1>共读书架</h1>
    <div class="tools">
      <button class="hbtn" id="night-toggle-shelf"><i data-lucide="moon" style="width:18px;height:18px"></i></button>
    </div>
  </div>
  <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
    <i data-lucide="upload-cloud" style="width:32px;height:32px"></i>
    <p>上传小说（TXT / EPUB）</p>
    <p style="font-size:11px;color:var(--sub);margin-top:2px">支持 UTF-8 / GBK / EPUB 格式</p>
  </div>
  <input type="file" id="file-input" accept=".txt,.epub">
  <div class="shelf-title">我的书架</div>
  <div id="book-list"></div>
</div>

<!-- Reader View -->
<div class="reader" id="reader-view">
  <div class="header">
    <button class="hbtn" id="back-to-shelf"><i data-lucide="arrow-left" style="width:18px;height:18px"></i></button>
    <h1 id="reader-title">...</h1>
    <div class="tools">
      <button class="hbtn" id="search-btn"><i data-lucide="search" style="width:16px;height:16px"></i></button>
      <button class="hbtn" id="bm-btn"><i data-lucide="bookmark" style="width:16px;height:16px"></i></button>
      <button class="hbtn" id="bm-toggle"><i data-lucide="bookmark-plus" style="width:16px;height:16px"></i></button>
      <button class="hbtn" id="night-toggle"><i data-lucide="moon" style="width:16px;height:16px"></i></button>
    </div>
  </div>

  <div class="reader-body">
    <div class="font-controls" style="margin-bottom:10px; justify-content:flex-end;">
      <button onclick="changeFontSize(-1)">A-</button>
      <span style="font-size:12px;color:var(--sub)" id="fs-label">16</span>
      <button onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="page-content" id="page-content"></div>
    <div class="legend">
      <span><span class="dot dot-user"></span>小羊的标注</span>
      <span><span class="dot dot-ai"></span>福福的标注</span>
    </div>
  </div>

  <div class="reader-footer">
    <button class="nav-btn" id="prev-btn"><i data-lucide="chevron-left" style="width:20px;height:20px"></i></button>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="page-info" id="page-info">1 / 1</span>
    <button class="nav-btn" id="next-btn"><i data-lucide="chevron-right" style="width:20px;height:20px"></i></button>
  </div>

  <div class="hl-toolbar" id="hl-toolbar">
    <button class="hl-user-btn" onclick="addHighlight('user')">小羊标注</button>
    <button class="hl-ai-btn" onclick="addHighlight('ai')">福福标注</button>
  </div>
</div>

<!-- Chat Toggle & Panel -->
<button class="chat-toggle" id="chat-toggle" style="display:none">
  <i data-lucide="message-circle" style="width:22px;height:22px"></i>
  <span class="badge" id="chat-badge">0</span>
</button>
<div class="chat-panel" id="chat-panel">
  <div class="chat-header">
    <h3>💬 共读聊天</h3>
    <button onclick="toggleChat()"><i data-lucide="x" style="width:16px;height:16px"></i></button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-row">
    <input type="text" id="chat-input" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">发送</button>
  </div>
</div>

<!-- Search -->
<div class="search-panel" id="search-panel" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="搜索内容..." oninput="doSearch()">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<!-- Bookmarks -->
<div class="bm-panel" id="bm-panel" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="bm-box">
    <h3>书签列表</h3>
    <div class="bm-list" id="bm-list"></div>
  </div>
</div>

<script>
const API = '/api/read';
let currentBook = null;
let currentPage = 0;
let totalPages = 0;
let fontSize = 16;
let selInfo = null;

// Night mode
function toggleNight() {
  document.body.classList.toggle('night');
  localStorage.setItem('read-night', document.body.classList.contains('night') ? '1' : '0');
}
if (localStorage.getItem('read-night') === '1') document.body.classList.add('night');
document.getElementById('night-toggle').onclick = toggleNight;
document.getElementById('night-toggle-shelf').onclick = toggleNight;

// Font size
function changeFontSize(d) {
  fontSize = Math.max(12, Math.min(24, fontSize + d));
  document.getElementById('page-content').style.fontSize = fontSize + 'px';
  document.getElementById('fs-label').textContent = fontSize;
  localStorage.setItem('read-fs', fontSize);
}
if (localStorage.getItem('read-fs')) { fontSize = +localStorage.getItem('read-fs'); }

// Shelf
async function loadShelf() {
  const r = await fetch(API + '/shelf');
  const shelf = await r.json();
  const list = document.getElementById('book-list');
  if (!shelf.length) {
    list.innerHTML = '<p style="text-align:center;color:var(--sub);font-size:13px;padding:20px">书架空空的，上传一本吧~</p>';
    return;
  }
  list.innerHTML = shelf.map(b => `
    <div class="book-card" onclick="openBook('${b.id}')">
      <div class="book-icon"><i data-lucide="book-open" style="width:20px;height:20px"></i></div>
      <div class="book-info">
        <h3>${esc(b.title)}</h3>
        <p>${b.pages}页 · ${Math.round(b.chars/1000)}k字</p>
      </div>
      <span class="book-progress">${b.progress||0}/${b.pages}</span>
      <button class="book-del" onclick="event.stopPropagation();deleteBook('${b.id}','${esc(b.title)}')"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
    </div>
  `).join('');
  lucide.createIcons();
}

async function deleteBook(id, title) {
  if (!confirm('删除「' + title + '」？')) return;
  await fetch(API + '/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadShelf();
}

// Upload
document.getElementById('file-input').onchange = async function() {
  const file = this.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('title', file.name);
  const zone = document.getElementById('upload-zone');
  zone.innerHTML = '<p>上传中...</p>';
  const r = await fetch(API + '/upload', {method:'POST', body: fd});
  const data = await r.json();
  zone.innerHTML = '<i data-lucide="upload-cloud" style="width:32px;height:32px"></i><p>上传小说（TXT / EPUB）</p><p style="font-size:11px;color:var(--sub);margin-top:2px">支持 UTF-8 / GBK / EPUB 格式</p>';
  lucide.createIcons();
  if (data.ok) loadShelf();
  else alert('上传失败');
  this.value = '';
};

// Open book
async function openBook(id) {
  currentBook = id;
  const meta = await (await fetch(API + '/meta?id=' + id)).json();
  currentPage = meta.progress || 0;
  document.getElementById('shelf-view').classList.add('hidden');
  document.getElementById('reader-view').classList.add('active');
  const shelf = await (await fetch(API + '/shelf')).json();
  const book = shelf.find(b => b.id === id);
  document.getElementById('reader-title').textContent = book ? book.title : '共读';
  document.getElementById('page-content').style.fontSize = fontSize + 'px';
  document.getElementById('fs-label').textContent = fontSize;
  loadPage(currentPage);
}

// Back to shelf
document.getElementById('back-to-shelf').onclick = function() {
  document.getElementById('shelf-view').classList.remove('hidden');
  document.getElementById('reader-view').classList.remove('active');
  currentBook = null;
  loadShelf();
};

// Load page
async function loadPage(page) {
  const r = await fetch(API + '/page?id=' + currentBook + '&page=' + page);
  const data = await r.json();
  currentPage = data.page;
  totalPages = data.total;
  let html = esc(data.content);
  const hls = (data.highlights || []).sort((a,b) => b.start - a.start);
  if (hls.length) {
    const text = data.content;
    let chars = [...text];
    let segments = [];
    let hlMap = new Array(chars.length).fill(null);
    for (const h of hls) {
      for (let i = h.start; i < h.end && i < chars.length; i++) {
        hlMap[i] = h.color === 'ai' ? 'hl-ai' : 'hl-user';
      }
    }
    let cur = '', curClass = null;
    for (let i = 0; i < chars.length; i++) {
      if (hlMap[i] !== curClass) {
        if (cur) segments.push({text: cur, cls: curClass});
        cur = ''; curClass = hlMap[i];
      }
      cur += chars[i];
    }
    if (cur) segments.push({text: cur, cls: curClass});
    html = segments.map(s => s.cls ? `<span class="${s.cls}">${esc(s.text)}</span>` : esc(s.text)).join('');
  }
  document.getElementById('page-content').innerHTML = html;
  document.getElementById('page-info').textContent = (currentPage + 1) + ' / ' + totalPages;
  document.getElementById('progress-fill').style.width = (totalPages > 1 ? (currentPage / (totalPages-1)) * 100 : 100) + '%';
  document.getElementById('prev-btn').disabled = currentPage <= 0;
  document.getElementById('next-btn').disabled = currentPage >= totalPages - 1;
  window.scrollTo({top: 0, behavior: 'instant'});
  updateBmBtn();
  fetch(API + '/progress', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book_id:currentBook,page:currentPage})});
}

document.getElementById('prev-btn').onclick = () => { if(currentPage > 0) loadPage(currentPage - 1); };
document.getElementById('next-btn').onclick = () => { if(currentPage < totalPages - 1) loadPage(currentPage + 1); };

// Swipe navigation
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  if (!currentBook) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) {
    if (dx > 0 && currentPage > 0) loadPage(currentPage - 1);
    else if (dx < 0 && currentPage < totalPages - 1) loadPage(currentPage + 1);
  }
});

// Keyboard
document.addEventListener('keydown', e => {
  if (!currentBook) return;
  if (e.key === 'ArrowLeft' && currentPage > 0) loadPage(currentPage - 1);
  if (e.key === 'ArrowRight' && currentPage < totalPages - 1) loadPage(currentPage + 1);
});

// Highlight
document.getElementById('page-content').addEventListener('mouseup', showHlToolbar);
document.getElementById('page-content').addEventListener('touchend', e => { setTimeout(showHlToolbar, 100); });

function showHlToolbar() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) {
    document.getElementById('hl-toolbar').classList.remove('show');
    return;
  }
  const range = sel.getRangeAt(0);
  const container = document.getElementById('page-content');
  const text = container.textContent;
  const selText = sel.toString();
  const startIdx = text.indexOf(selText);
  if (startIdx < 0) return;
  selInfo = { start: startIdx, end: startIdx + selText.length, text: selText };
  const rect = range.getBoundingClientRect();
  const cRect = container.getBoundingClientRect();
  const tb = document.getElementById('hl-toolbar');
  tb.style.left = (rect.left - cRect.left + rect.width/2 - 75) + 'px';
  tb.style.top = (rect.top - cRect.top - 40) + 'px';
  tb.classList.add('show');
}

async function addHighlight(color) {
  if (!selInfo || !currentBook) return;
  await fetch(API + '/highlight', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({book_id: currentBook, page: currentPage, start: selInfo.start, end: selInfo.end, text: selInfo.text, color})
  });
  document.getElementById('hl-toolbar').classList.remove('show');
  window.getSelection().removeAllRanges();
  selInfo = null;
  loadPage(currentPage);
}

document.addEventListener('click', e => {
  if (!e.target.closest('#hl-toolbar') && !window.getSelection().toString()) {
    document.getElementById('hl-toolbar').classList.remove('show');
  }
});

// Bookmark
async function toggleBookmark() {
  await fetch(API + '/bookmark', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({book_id: currentBook, page: currentPage})
  });
  loadPage(currentPage);
}
document.getElementById('bm-toggle').onclick = toggleBookmark;

function updateBmBtn() {
  // visual indicator handled by icon color
}

// Bookmark list
document.getElementById('bm-btn').onclick = async function() {
  const meta = await (await fetch(API + '/meta?id=' + currentBook)).json();
  const list = document.getElementById('bm-list');
  const bms = meta.bookmarks || [];
  if (!bms.length) { list.innerHTML = '<p style="text-align:center;color:var(--sub);font-size:13px;padding:12px">还没有书签~</p>'; }
  else {
    list.innerHTML = bms.sort((a,b) => a.page - b.page).map(b => `
      <div class="bm-item" onclick="jumpToPage(${b.page})">
        <span>第 ${b.page + 1} 页</span>
        <span style="font-size:11px;color:var(--sub)">${new Date(b.created_at*1000).toLocaleDateString()}</span>
      </div>
    `).join('');
  }
  document.getElementById('bm-panel').classList.add('show');
};

function jumpToPage(p) {
  document.getElementById('bm-panel').classList.remove('show');
  document.getElementById('search-panel').classList.remove('show');
  loadPage(p);
}

// Search
document.getElementById('search-btn').onclick = function() {
  document.getElementById('search-panel').classList.add('show');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
  setTimeout(() => document.getElementById('search-input').focus(), 100);
};

let searchTimer = null;
async function doSearch() {
  clearTimeout(searchTimer);
  const q = document.getElementById('search-input').value.trim();
  if (!q) { document.getElementById('search-results').innerHTML = ''; return; }
  searchTimer = setTimeout(async () => {
    const r = await fetch(API + '/search?id=' + currentBook + '&q=' + encodeURIComponent(q));
    const results = await r.json();
    const div = document.getElementById('search-results');
    if (!results.length) { div.innerHTML = '<p style="text-align:center;color:var(--sub);font-size:13px;padding:12px">没找到~</p>'; return; }
    div.innerHTML = results.map(r => {
      const snip = esc(r.snippet).replace(new RegExp(esc(q), 'gi'), m => '<b>' + m + '</b>');
      return `<div class="sr" onclick="jumpToPage(${r.page})">第${r.page+1}页: ...${snip}...</div>`;
    }).join('');
  }, 300);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Init
loadShelf();
lucide.createIcons();

// ---- Chat ----
let chatOpen = false;
let chatLastTs = 0;
let chatPollTimer = null;
let unreadCount = 0;

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chat-panel').classList.toggle('show', chatOpen);
  if (chatOpen) {
    unreadCount = 0;
    updateBadge();
    const el = document.getElementById('chat-messages');
    el.scrollTop = el.scrollHeight;
    document.getElementById('chat-input').focus();
  }
}
document.getElementById('chat-toggle').onclick = toggleChat;

function updateBadge() {
  const b = document.getElementById('chat-badge');
  if (unreadCount > 0) {
    b.style.display = 'flex';
    b.textContent = unreadCount > 9 ? '9+' : unreadCount;
  } else {
    b.style.display = 'none';
  }
}

function renderMsg(m) {
  const isMe = m.sender === '小羊';
  const time = new Date(m.ts * 1000).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  const pageTag = m.page >= 0 ? ` · p${m.page+1}` : '';
  return `<div class="chat-msg ${isMe ? 'me' : 'other'}">
    ${esc(m.text)}
    <div class="msg-meta">${isMe ? '小羊' : '福福'} ${time}${pageTag}</div>
  </div>`;
}

async function loadChat() {
  try {
    const r = await fetch(API + '/chat?since=' + chatLastTs);
    const msgs = await r.json();
    if (msgs.length) {
      const el = document.getElementById('chat-messages');
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 50;
      for (const m of msgs) {
        el.insertAdjacentHTML('beforeend', renderMsg(m));
        if (m.ts > chatLastTs) chatLastTs = m.ts;
        if (!chatOpen && m.sender !== '小羊') {
          unreadCount++;
        }
      }
      updateBadge();
      if (atBottom || chatOpen) el.scrollTop = el.scrollHeight;
    }
  } catch(e) {}
}

async function sendChat() {
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const body = { text, sender: '小羊', page: currentPage, book_id: currentBook || '' };
  try {
    const r = await fetch(API + '/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (data.msg) {
      const el = document.getElementById('chat-messages');
      el.insertAdjacentHTML('beforeend', renderMsg(data.msg));
      if (data.msg.ts > chatLastTs) chatLastTs = data.msg.ts;
      el.scrollTop = el.scrollHeight;
    }
  } catch(e) {}
}

function startChatPoll() {
  if (chatPollTimer) clearInterval(chatPollTimer);
  loadChat();
  chatPollTimer = setInterval(loadChat, 3000);
}

// Show chat toggle when in reader
const origOpenBook = openBook;
openBook = async function(id) {
  await origOpenBook(id);
  document.getElementById('chat-toggle').style.display = 'flex';
  startChatPoll();
};
const origBack = document.getElementById('back-to-shelf').onclick;
document.getElementById('back-to-shelf').onclick = function() {
  document.getElementById('chat-toggle').style.display = 'none';
  document.getElementById('chat-panel').classList.remove('show');
  chatOpen = false;
  if (chatPollTimer) clearInterval(chatPollTimer);
  origBack.call(this);
};

// Handle URL params
const params = new URLSearchParams(location.search);
if (params.get('book')) { openBook(params.get('book')); }
</script>
