<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>霖的朋友圈 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #c9d6e2 url('/static/bg-butterfly.jpg') center/cover fixed;
    min-height: 100vh;
    color: var(--ink, #3a4a6b);
    padding-bottom: 30px;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    gap: 12px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.66);
    cursor: pointer;
    color: var(--accent, #5b7ec2);
  }

  .header h1 { font-size: 20px; font-weight: 600; }

  .feed { padding: 0 16px; }

  .post-card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(22px) saturate(1.35);
    -webkit-backdrop-filter: blur(22px) saturate(1.35);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 10px rgba(100,140,210,0.07);
  }

  .post-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .post-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }

  .post-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent, #5b7ec2);
  }

  .post-time {
    font-size: 11px;
    color: var(--line, #b0bdd4);
    margin-left: auto;
  }

  .post-content {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink, #3a4a6b);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 12px;
  }

  .post-mood {
    font-size: 20px;
    margin-bottom: 10px;
  }

  /* Comments */
  .comments-area {
    border-top: 1px solid rgba(100,140,210,0.08);
    padding-top: 12px;
  }

  .comment {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .comment-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }

  .comment-avatar.sheep { background: rgba(139,170,230,0.15); }
  .comment-avatar.fox { background: rgba(220,130,150,0.15); }

  .comment-body { flex: 1; min-width: 0; }

  .comment-meta {
    font-size: 11px;
    margin-bottom: 2px;
  }

  .comment-meta .author {
    font-weight: 600;
    color: var(--accent, #5b7ec2);
  }

  .comment-meta .author.fox { color: #c26b8a; }

  .comment-meta .time {
    color: #c0ccdf;
    margin-left: 6px;
  }

  .comment-text {
    font-size: 13px;
    color: #4a5a7b;
    line-height: 1.5;
  }

  .comment-input-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .comment-input-row input {
    flex: 1;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(100,140,210,0.15);
    background: rgba(255,255,255,0.8);
    font-size: 13px;
    color: var(--ink, #3a4a6b);
    outline: none;
  }

  .comment-input-row input::placeholder { color: #c0ccdf; }

  .comment-input-row button {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    background: var(--accent, #5b7ec2);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .comment-input-row button:active { opacity: 0.8; }

  .toggle-comments {
    font-size: 12px;
    color: #8aaee0;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
  }

  .toggle-comments svg { width: 12px; height: 12px; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--line, #b0bdd4);
    font-size: 14px;
    line-height: 2;
  }
</style>
<script src="/static/theme.js?v=32"></script>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='/'">
    <i data-lucide="chevron-left"></i>
  </button>
  <h1>霖的朋友圈</h1>
</div>

<div class="feed" id="feed"></div>

<script>
let postsData = {};

async function loadFeed() {
  try {
    const res = await fetch('/api/diary');
    const data = await res.json();

    const el = document.getElementById('feed');

    if (data.posts.length === 0) {
      el.innerHTML = '<div class="empty-state">还没有动态<br>福福会随时发的～</div>';
      return;
    }

    // Load full data for each post
    const fullPosts = await Promise.all(
      data.posts.map(p => fetch('/api/diary/post?id=' + p.id).then(r => r.json()))
    );

    fullPosts.forEach(p => { postsData[p.id] = p; });

    el.innerHTML = fullPosts.map(p => renderPost(p)).join('');
    lucide.createIcons();
  } catch (e) {
    document.getElementById('feed').innerHTML =
      '<div class="empty-state">加载失败，请刷新</div>';
  }
}

function renderPost(p) {
  const date = new Date(p.created_at * 1000);
  const timeStr = date.toLocaleString('zh-CN', {
    timeZone: 'Asia/Shanghai',
    month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });

  const comments = (p.comments || []);
  const commentCount = comments.length;
  const commentsHtml = comments.map(c => renderComment(c)).join('');

  return `
    <div class="post-card">
      <div class="post-header">
        <img class="post-avatar" src="/static/avatar-fufu.jpg" alt="福福">
        <div class="post-name">周宥霖</div>
        <div class="post-time">${timeStr}</div>
      </div>
      ${p.mood ? `<div class="post-mood">${p.mood}</div>` : ''}
      <div class="post-content">${escHtml(p.content)}</div>
      <div class="comments-area">
        <div class="toggle-comments" onclick="toggleComments('${p.id}')">
          <i data-lucide="message-circle"></i>
          ${commentCount > 0 ? commentCount + ' 条评论' : '写评论'}
        </div>
        <div id="comments-${p.id}" style="display:none">
          <div id="clist-${p.id}">${commentsHtml}</div>
          <div class="comment-input-row">
            <input type="text" id="cinput-${p.id}" placeholder="写评论..."
                   onkeydown="if(event.key==='Enter')postComment('${p.id}')">
            <button onclick="postComment('${p.id}')">发送</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderComment(c) {
  const isFox = c.author === 'fox';
  const name = isFox ? '福福' : '小羊';
  const avatarSrc = isFox ? '/static/avatar-fufu.jpg' : '/static/avatar-xiaoyang.jpg';
  const t = new Date(c.time * 1000);
  const timeStr = t.toLocaleString('zh-CN', {
    timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit'
  });

  return `
    <div class="comment">
      <img class="comment-avatar" src="${avatarSrc}" alt="${name}" style="object-fit:cover">
      <div class="comment-body">
        <div class="comment-meta">
          <span class="author ${isFox ? 'fox' : ''}">${name}</span>
          <span class="time">${timeStr}</span>
        </div>
        <div class="comment-text">${escHtml(c.text)}</div>
      </div>
    </div>
  `;
}

function toggleComments(postId) {
  const el = document.getElementById('comments-' + postId);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function postComment(postId) {
  const input = document.getElementById('cinput-' + postId);
  const text = input.value.trim();
  if (!text) return;

  input.value = '';

  const res = await fetch('/api/diary/comment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: postId, text, author: 'sheep' })
  });
  const data = await res.json();

  if (data.ok) {
    const clist = document.getElementById('clist-' + postId);
    clist.insertAdjacentHTML('beforeend', renderComment(data.comment));
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

loadFeed();
</script>
</body>
</html>
