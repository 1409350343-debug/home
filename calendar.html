<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>CALENDAR · DIARY</title>
<link rel="icon" href="/static/favicon-32.png"><script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20"><link rel="stylesheet" href="/static/core-nav.css?v=14">
<script src="/static/common.js?v=2"></script><script src="/static/core-nav.js?v=4"></script><script src="/static/theme.js?v=40"></script>
<style>
:root{--accent:#5b8fd4;--ink:#2b4968;--ink2:#587491;--ink3:#879cb3;--line:rgba(119,149,181,.22)}
body{margin:0;background:#d7e1e9 url('/static/bg-butterfly.jpg') center/cover fixed;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:0 16px}.wrap{max-width:680px;margin:auto}.head{padding:24px 2px 12px;display:flex;align-items:end;justify-content:space-between}.head h1{margin:0;font-size:23px;font-weight:550}.head small{color:var(--ink3)}
.glass{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.75);border-radius:20px;box-shadow:0 7px 25px rgba(73,104,139,.12);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.cal{padding:16px}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.month button,.round{border:0;background:#e8efdb;color:#729763;border-radius:10px;width:30px;height:30px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:10px;color:var(--ink3);margin-bottom:4px}.day{min-height:57px;border-radius:11px;padding-top:9px;font-size:12px;cursor:pointer;position:relative;transition:background .2s,color .2s}.day.other{opacity:.25}.day.today{background:#e8efdb;color:#55704e}.day.selected{background:var(--accent);color:white}.mood-dots{position:absolute;bottom:7px;display:flex;gap:3px;justify-content:center}.mood-dots.sheep{right:51%}.mood-dots.fufu{left:51%}.mood-dot{width:5px;height:5px;border-radius:50%}.mood-dots.fufu .mood-dot{border-radius:1.5px}.day .diary-mark{position:absolute;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.42;right:7px;top:7px}
.datebar,.entries{display:none}
.sheetbg{display:none;position:fixed;inset:0;z-index:120;background:rgba(25,45,68,.35);align-items:flex-end}.sheetbg.show{display:flex}.sheet{width:100%;max-width:680px;margin:auto;background:#f7fafc;border-radius:22px 22px 0 0;padding:18px 17px calc(24px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 5px}.mood-hint{font-size:10px;color:var(--ink3);margin:0 0 10px}.author-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e8eef4;border-radius:12px;padding:4px;margin:10px 0}.author-tabs button{border:0;border-radius:9px;background:transparent;color:var(--ink3);padding:8px;font-size:12px}.author-tabs button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 2px 8px rgba(73,104,139,.1)}.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.moods button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:11px;padding:8px 7px;color:var(--ink2)}.moods button .mood-icon{width:18px;height:18px;stroke-width:1.7;flex:0 0 auto}.moods button .color{width:6px;height:6px;border-radius:50%;margin-left:auto}.moods button.on{border-color:var(--accent);background:#eaf2fb;color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}.sheet textarea,.sheet input,.sheet select{width:100%;box-sizing:border-box;margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;font:inherit;color:var(--ink)}.sheet textarea{min-height:110px;resize:vertical}.checks{display:flex;gap:15px;font-size:12px;color:var(--ink2);margin-top:10px}.save{width:100%;margin-top:12px;border:0;border-radius:12px;background:var(--accent);color:white;padding:11px;font-size:13px}
.lock-trigger{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fffdf5;color:var(--ink);font:inherit;display:flex;justify-content:space-between;align-items:center}.lock-trigger svg{width:16px}.lock-modal{display:none;position:fixed;inset:0;z-index:240;background:rgba(55,70,45,.34);align-items:center;justify-content:center;padding:18px}.lock-modal.show{display:flex}.lock-dialog{width:min(390px,100%);padding:18px;border-radius:22px;background:#eaf2dc;border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 55px rgba(65,88,52,.22)}.lock-dialog h3{margin:0;font-size:17px}.lock-dialog p{font-size:10px;color:var(--ink2);margin:5px 0 12px}.lock-options{display:grid;gap:6px}.lock-option{width:100%;border:1px solid rgba(118,149,99,.2);background:rgba(255,253,241,.74);border-radius:12px;padding:9px 11px;color:var(--ink);font:inherit;display:flex;align-items:center}.lock-option::before{content:"";width:12px;height:12px;border:1.5px solid var(--ink3);border-radius:50%;margin-right:9px}.lock-option span{margin-left:auto;color:var(--ink3);font-size:9px}.lock-option.on{background:#d7e7c6;border-color:var(--accent)}.lock-option.on::before{border:4px solid var(--accent);background:white}.lock-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}.lock-actions button{border:0;border-radius:11px;padding:10px;font:inherit}.lock-cancel{background:rgba(255,253,241,.8);color:var(--ink2)}.lock-confirm{background:var(--accent);color:white}
</style>
</head>
<body><main class="wrap">
<header class="head"><h1 class="english-page-title">calendar</h1><small>mood · shared notes</small></header>
<section class="cal glass">
 <div class="month"><button onclick="moveMonth(-1)">‹</button><b id="monthLabel"></b><button onclick="moveMonth(1)">›</button></div>
 <div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
 <div class="days" id="days"></div>
</section>
</main>
<div class="sheetbg" id="moodSheet" onclick="if(event.target===this)closeSheets()"><div class="sheet"><h3>这一天是什么心情？</h3><p class="mood-hint">小羊用圆点、福福用方点；每人最多选择三种</p><div class="author-tabs" id="moodAuthors"></div><div class="moods" id="moods"></div><button class="save" onclick="saveMoods()">保存心情</button></div></div>
<div class="sheetbg" id="writeSheet" onclick="if(event.target===this)closeSheets()"><div class="sheet">
 <h3>写下这一天</h3><div class="author-tabs" id="writeAuthors"></div><textarea id="diaryText" placeholder="今天发生了什么……"></textarea>
 <p class="mood-hint" style="margin-top:10px">选择这篇日记的心情（最多三种）</p><div class="moods" id="writeMoods"></div>
 <input id="diaryTags" placeholder="标签，用逗号分开">
 <div class="checks"><label><input type="checkbox" id="coauthored" style="width:auto;margin:0"> 邀请福福一起写</label></div>
 <input type="hidden" id="lockFor" value="0"><button class="lock-trigger" id="lockButton" type="button" onclick="openLockModal()"><span>不封存</span><i data-lucide="lock-keyhole"></i></button>
 <button class="save" onclick="saveDiary()">保存这篇日记</button>
</div></div>
<div class="lock-modal" id="lockModal" onclick="if(event.target===this)closeLockModal()"><div class="lock-dialog"><h3>封存这一篇</h3><p>到时间之前，谁都不能打开，包括你自己。</p><div class="lock-options" id="lockOptions"></div><div class="lock-actions"><button class="lock-cancel" type="button" onclick="closeLockModal()">取消</button><button class="lock-confirm" type="button" onclick="confirmLock()">选定</button></div></div></div>
<script>
const moodOptions=[
 {key:'love',name:'心动',icon:'heart',color:'#e9859e'},{key:'happy',name:'开心',icon:'smile',color:'#efbd58'},
 {key:'calm',name:'平静',icon:'waves',color:'#86ad83'},{key:'tired',name:'疲惫',icon:'moon',color:'#78a8d2'},
 {key:'low',name:'低落',icon:'cloud-rain',color:'#8d82b8'},{key:'angry',name:'生气',icon:'frown',color:'#db6b63'},
 {key:'thinking',name:'思考',icon:'brain',color:'#7893a7'},{key:'surprised',name:'惊喜',icon:'sparkles',color:'#e6a943'},
 {key:'sad',name:'难过',icon:'cloud',color:'#71899d'},{key:'passionate',name:'热烈',icon:'flame',color:'#ed8651'},
 {key:'healing',name:'治愈',icon:'sprout',color:'#70b697'},{key:'relaxed',name:'放松',icon:'gamepad-2',color:'#9b83c5'},
 {key:'missing',name:'想你',icon:'message-circle-heart',color:'#d9899f'},{key:'bored',name:'无聊',icon:'circle-ellipsis',color:'#9aa49b'},
 {key:'lucky',name:'幸运',icon:'clover',color:'#79ad72'},{key:'fulfilled',name:'充实',icon:'list-checks',color:'#6f9e87'},
 {key:'irritable',name:'烦躁',icon:'zap',color:'#df8a58'},{key:'heartache',name:'心疼',icon:'heart-handshake',color:'#c97b88'},
 {key:'free',name:'自由',icon:'bird',color:'#72a9b7'},{key:'expecting',name:'期待',icon:'telescope',color:'#7f91bd'},
 {key:'sweet',name:'甜蜜',icon:'candy',color:'#d990aa'},{key:'craving',name:'嘴馋',icon:'utensils',color:'#c89762'},
 {key:'aggrieved',name:'委屈',icon:'cloud-rain',color:'#8c91b1'},{key:'embarrassed',name:'尴尬',icon:'meh',color:'#b28d79'}
];
const moodMap=Object.fromEntries(moodOptions.map(x=>[x.key,x]));
const legacyMoodKeys={'🥰':'love','😊':'happy','😌':'calm','😪':'tired','😔':'low','😤':'angry','🤔':'thinking','✨':'surprised','🌧️':'sad','🔥':'passionate','🌱':'healing','🎮':'relaxed'};
const normalizeMoods=value=>(Array.isArray(value)?value:(value?[value]:[])).map(x=>legacyMoodKeys[x]||x).filter(x=>moodMap[x]).slice(0,3);
const normalizeDayMoods=value=>value&&typeof value==='object'&&!Array.isArray(value)?{sheep:normalizeMoods(value.sheep),fufu:normalizeMoods(value.fufu)}:{sheep:normalizeMoods(value),fufu:[]};
const copyDayMoods=value=>{const moods=normalizeDayMoods(value);return{sheep:[...moods.sheep],fufu:[...moods.fufu]}};
let view=new Date(), selected='', moodData={}, diaryPosts=[],draftMoodByAuthor={sheep:[],fufu:[]},activeAuthor='sheep';
const localKey=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const esc=HomeCommon.escapeHtml;
const lockChoices=[['0','不封存'],['3600','1 小时'],['21600','6 小时'],['86400','一天'],['604800','一周'],['2592000','一个月'],['15552000','半年']];let pendingLock='0';
function openLockModal(){pendingLock=lockFor.value;renderLockOptions();lockModal.classList.add('show')}
function closeLockModal(){lockModal.classList.remove('show')}
function renderLockOptions(){lockOptions.innerHTML=lockChoices.map(([value,label])=>`<button type="button" class="lock-option${pendingLock===value?' on':''}" onclick="pendingLock='${value}';renderLockOptions()">${label}<span>${value==='0'?'现在可见':'到期打开'}</span></button>`).join('')}
function confirmLock(){lockFor.value=pendingLock;lockButton.querySelector('span').textContent=lockChoices.find(x=>x[0]===pendingLock)?.[1]||'不封存';closeLockModal()}
function monthKey(){return `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`}
async function load(){
 render();
 const [moodsResult,diaryResult]=await Promise.allSettled([
  fetch('/api/calendar/moods?month='+monthKey()).then(r=>{if(!r.ok)throw new Error('moods');return r.json()}),
  fetch('/api/diary').then(r=>{if(!r.ok)throw new Error('diary');return r.json()})
 ]);
 if(moodsResult.status==='fulfilled')moodData=moodsResult.value||{};
 if(diaryResult.status==='fulfilled')diaryPosts=diaryResult.value.posts||[];
 render();
}
function render(){
 monthLabel.textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;
 if(!selected)selected=localKey(new Date());
 const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
 const diaryDates=new Set(diaryPosts.map(p=>p.entry_date||localKey(new Date(p.created_at*1000))));diaryDates.add('2026-07-29');
 let html='';
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=localKey(d),other=d.getMonth()!==m;
  const dayMoods=normalizeDayMoods(moodData[k]||(k==='2026-07-29'?{sheep:['happy','healing'],fufu:[]}:null)),sheepDots=dayMoods.sheep.map(key=>`<i class="mood-dot" style="background:${moodMap[key]?.color||'#91a3b4'}"></i>`).join('');
  html+=`<div class="day${other?' other':''}${k===localKey(new Date())?' today':''}${k===selected?' selected':''}" onclick="selectDate('${k}')">${d.getDate()}${sheepDots?`<span class="mood-dots sheep">${sheepDots}</span>`:''}${diaryDates.has(k)?'<i class="diary-mark"></i>':''}</div>`;
 }
 days.innerHTML=html;
}
function selectDate(k){location.href='/diary-day.html?date='+encodeURIComponent(k)} function moveMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);selected=monthKey()+'-01';load()}
function renderAuthorTabs(id,choiceId){document.getElementById(id).innerHTML=`<button class="${activeAuthor==='sheep'?'on':''}" onclick="setMoodAuthor('sheep','${id}','${choiceId}')">小羊</button><button class="${activeAuthor==='fufu'?'on':''}" onclick="setMoodAuthor('fufu','${id}','${choiceId}')">福福 AI</button>`}
function setMoodAuthor(author,tabsId,choiceId){activeAuthor=author;renderAuthorTabs(tabsId,choiceId);renderMoodChoices(choiceId)}
function renderMoodChoices(id){const chosen=draftMoodByAuthor[activeAuthor];document.getElementById(id).innerHTML=moodOptions.map(x=>`<button class="${chosen.includes(x.key)?'on':''}" onclick="toggleMood('${x.key}','${id}')"><i class="mood-icon" data-lucide="${x.icon}" style="color:${x.color}"></i><span>${x.name}</span><i class="color" style="background:${x.color}"></i></button>`).join('');if(window.lucide)lucide.createIcons()}
function toggleMood(key,id){const chosen=draftMoodByAuthor[activeAuthor],at=chosen.indexOf(key);if(at>=0)chosen.splice(at,1);else if(chosen.length<3)chosen.push(key);renderMoodChoices(id)}
function openMood(){activeAuthor='sheep';draftMoodByAuthor=copyDayMoods(moodData[selected]);renderAuthorTabs('moodAuthors','moods');renderMoodChoices('moods');moodSheet.classList.add('show')}
async function saveMoods(close=true){const saved=copyDayMoods(draftMoodByAuthor);await fetch('/api/calendar/mood',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:selected,mood:saved})});moodData[selected]=saved;if(close)closeSheets();render()}
function openWrite(){activeAuthor='sheep';draftMoodByAuthor=copyDayMoods(moodData[selected]);renderAuthorTabs('writeAuthors','writeMoods');renderMoodChoices('writeMoods');writeSheet.classList.add('show')} function closeSheets(){document.querySelectorAll('.sheetbg').forEach(x=>x.classList.remove('show'))}
async function saveDiary(){const text=diaryText.value.trim();if(!text)return;const seconds=Number(lockFor.value)||0;await saveMoods(false);const mood=[...draftMoodByAuthor[activeAuthor]];
 await fetch('/api/diary/write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:text,mood,entry_date:selected,author:activeAuthor,coauthored:coauthored.checked,tags:diaryTags.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),unlock_at:seconds?Date.now()/1000+seconds:0})});
 diaryText.value='';diaryTags.value='';coauthored.checked=false;closeSheets();await load();
}
window.addEventListener('DOMContentLoaded',()=>{selected=localKey(new Date());renderCoreNav('calendar');load();});
</script></body></html>
