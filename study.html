<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>书房 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg, var(--bg, #e8f0fe)) var(--bg-img, url('/static/bg.jpg')) center/cover fixed;
    min-height: 100vh;
    color: var(--ink, #3a4a6b);
    padding-bottom: 40px;
  }

  .header {
    display: flex; align-items: center;
    padding: 16px 20px 12px; gap: 12px;
  }

  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.6); border-radius: 12px;
    border: none; cursor: pointer; color: var(--accent, #5b7ec2);
  }

  .header h1 { font-size: 20px; font-weight: 600; }

  .tabs {
    display: flex; margin: 0 16px 12px; gap: 8px;
  }

  .tab {
    flex: 1; padding: 12px; text-align: center;
    background: rgba(255,255,255,0.6);
    border-radius: 12px; cursor: pointer;
    font-size: 13px; color: #8aaee0;
    border: 1px solid transparent;
    transition: all 0.15s;
  }

  .tab.active {
    background: rgba(255,255,255,0.9);
    color: var(--accent, #5b7ec2); font-weight: 600;
    border-color: rgba(91,126,194,0.2);
  }

  .tab .count {
    display: block; font-size: 18px; font-weight: 700;
    margin-bottom: 2px;
  }

  .glass {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 18px 20px;
    margin: 0 16px 12px;
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 10px rgba(100,140,210,0.07);
  }

  .note-card {
    background: rgba(255,255,255,0.9);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid rgba(100,140,210,0.08);
    cursor: pointer;
    transition: transform 0.12s;
  }

  .note-card:active { transform: scale(0.98); }

  .note-title {
    font-size: 14px; font-weight: 600; color: var(--ink, #3a4a6b);
    margin-bottom: 6px;
  }

  .note-preview {
    font-size: 12px; color: #8a9bbc; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  .note-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px;
  }

  .note-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(91,126,194,0.1); color: var(--accent, #5b7ec2);
  }

  .note-time {
    font-size: 10px; color: #c0ccdf; margin-left: auto;
  }

  /* Modal */
  .modal {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.35); z-index: 100;
    align-items: flex-end; justify-content: center;
  }

  .modal.show { display: flex; }

  .modal-inner {
    background: #fff; border-radius: 20px 20px 0 0;
    width: 100%; max-height: 85vh; overflow-y: auto;
    padding: 24px 20px 30px;
  }

  .modal-title {
    font-size: 16px; font-weight: 600; color: var(--ink, #3a4a6b);
    margin-bottom: 16px;
  }

  .modal-content {
    font-size: 14px; line-height: 1.8; color: #4a5a7b;
    white-space: pre-wrap; word-break: break-word;
    margin-bottom: 16px;
  }

  .modal-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }

  .modal-close {
    width: 100%; padding: 12px;
    border-radius: 12px; border: none;
    background: rgba(91,126,194,0.1);
    color: var(--accent, #5b7ec2); font-size: 14px; cursor: pointer;
  }

  .modal-del {
    width: 100%; padding: 12px; margin-top: 8px;
    border-radius: 12px; border: none;
    background: rgba(220,100,100,0.08);
    color: #c26b6b; font-size: 13px; cursor: pointer;
  }

  /* Add form */
  .add-btn {
    position: fixed; bottom: 20px; right: 20px;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--accent, #5b7ec2); color: #fff;
    border: none; cursor: pointer;
    box-shadow: 0 4px 15px rgba(91,126,194,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; z-index: 50;
  }

  .add-form { padding: 24px 20px 30px; }

  .add-form label {
    display: block; font-size: 12px; color: #8a9bbc;
    margin-bottom: 6px; margin-top: 14px;
  }

  .add-form label:first-child { margin-top: 0; }

  .add-form input, .add-form textarea, .add-form select {
    width: 100%; padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(100,140,210,0.15);
    background: rgba(255,255,255,0.8);
    font-size: 13px; color: var(--ink, #3a4a6b); outline: none;
    font-family: inherit;
  }

  .add-form textarea { min-height: 120px; resize: vertical; line-height: 1.7; }

  .add-form .submit-btn {
    width: 100%; padding: 12px; margin-top: 18px;
    border-radius: 12px; border: none;
    background: var(--accent, #5b7ec2); color: #fff;
    font-size: 14px; cursor: pointer;
  }

  .empty-hint {
    text-align: center; color: #c0ccdf;
    font-size: 13px; padding: 40px 0; line-height: 2;
  }
</style>
<script src="/static/theme.js?v=32"></script>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='/'">
    <i data-lucide="chevron-left"></i>
  </button>
  <h1>书房</h1>
</div>

<div class="tabs">
  <div class="tab active" id="tabTrivia" onclick="switchTab('trivia')">
    <span class="count" id="countTrivia">0</span>
    杂学冷知识
  </div>
  <div class="tab" id="tabPro" onclick="switchTab('professional')">
    <span class="count" id="countPro">0</span>
    专业知识
  </div>
</div>

<div id="noteList" style="padding: 0 16px;"></div>

<button class="add-btn" onclick="openAddModal()">+</button>

<!-- View Modal -->
<div class="modal" id="viewModal" onclick="if(event.target===this)closeView()">
  <div class="modal-inner">
    <div class="modal-title" id="viewTitle"></div>
    <div class="modal-content" id="viewContent"></div>
    <div class="modal-tags" id="viewTags"></div>
    <button class="modal-close" onclick="closeView()">关闭</button>
    <button class="modal-del" id="viewDel">删除</button>
  </div>
</div>

<!-- Add Modal -->
<div class="modal" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="modal-inner add-form">
    <div class="modal-title">添加知识</div>
    <label>标题</label>
    <input type="text" id="addTitle" placeholder="知识标题">
    <label>内容</label>
    <textarea id="addContent" placeholder="详细内容..."></textarea>
    <label>分类</label>
    <select id="addCat">
      <option value="trivia">杂学冷知识</option>
      <option value="professional">专业知识</option>
    </select>
    <label>标签（逗号分隔）</label>
    <input type="text" id="addTags" placeholder="如：生物,有趣">
    <button class="submit-btn" onclick="submitNote()">添加</button>
  </div>
</div>

<script>
let currentCat = 'trivia';

async function loadStats() {
  const res = await fetch('/api/study/stats');
  const data = await res.json();
  document.getElementById('countTrivia').textContent = data.trivia;
  document.getElementById('countPro').textContent = data.professional;
}

async function loadNotes() {
  const res = await fetch('/api/study/notes?cat=' + currentCat);
  const data = await res.json();
  const el = document.getElementById('noteList');

  if (data.length === 0) {
    el.innerHTML = '<div class="empty-hint">还没有内容<br>点右下角 + 添加</div>';
    return;
  }

  el.innerHTML = data.map(n => {
    const date = new Date(n.created_at * 1000);
    const timeStr = date.toLocaleString('zh-CN', {
      timeZone: 'Asia/Shanghai',
      month: 'numeric', day: 'numeric'
    });
    const tags = (n.tags || []).map(t => `<span class="note-tag">${escHtml(t)}</span>`).join('');

    return `
      <div class="note-card" onclick="viewNote(${n.id})">
        <div class="note-title">${escHtml(n.title)}</div>
        <div class="note-preview">${escHtml(n.content)}</div>
        <div class="note-meta">
          ${tags}
          <span class="note-time">${timeStr}</span>
        </div>
      </div>
    `;
  }).join('');
}

function switchTab(cat) {
  currentCat = cat;
  document.getElementById('tabTrivia').classList.toggle('active', cat === 'trivia');
  document.getElementById('tabPro').classList.toggle('active', cat === 'professional');
  loadNotes();
}

let notesCache = {};

async function viewNote(id) {
  const res = await fetch('/api/study/notes');
  const data = await res.json();
  const note = data.find(n => n.id === id);
  if (!note) return;

  document.getElementById('viewTitle').textContent = note.title;
  document.getElementById('viewContent').textContent = note.content;
  document.getElementById('viewTags').innerHTML =
    (note.tags || []).map(t => `<span class="note-tag">${escHtml(t)}</span>`).join('');
  document.getElementById('viewDel').onclick = () => deleteNote(id);
  document.getElementById('viewModal').classList.add('show');
}

function closeView() {
  document.getElementById('viewModal').classList.remove('show');
}

async function deleteNote(id) {
  if (!confirm('删除这条知识？')) return;
  await fetch('/api/study/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  closeView();
  loadNotes();
  loadStats();
}

function openAddModal() {
  document.getElementById('addCat').value = currentCat;
  document.getElementById('addModal').classList.add('show');
}

function closeAdd() {
  document.getElementById('addModal').classList.remove('show');
}

async function submitNote() {
  const title = document.getElementById('addTitle').value.trim();
  const content = document.getElementById('addContent').value.trim();
  const category = document.getElementById('addCat').value;
  const tagsStr = document.getElementById('addTags').value.trim();
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];

  if (!title || !content) return;

  await fetch('/api/study/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, content, category, tags })
  });

  document.getElementById('addTitle').value = '';
  document.getElementById('addContent').value = '';
  document.getElementById('addTags').value = '';
  closeAdd();
  loadNotes();
  loadStats();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

loadStats();
loadNotes();
lucide.createIcons();
</script>
</body>
</html>
