<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="var(--bg, #e8f0fe)">
<title>钓鱼 · Our Home</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/static/common.css?v=20">
<script src="/static/common.js?v=2"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg, var(--bg, #e8f0fe)) var(--bg-img, url('/static/bg.jpg')) center/cover fixed;
    min-height: 100vh;
    color: var(--ink, #3a4a6b);
    padding-bottom: 30px;
  }

  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px 12px;
    gap: 12px;
  }

  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.6); border-radius: 12px;
    border: none; cursor: pointer; color: var(--accent, #5b7ec2);
  }

  .header h1 { font-size: 20px; font-weight: 600; }

  .stats-bar {
    margin: 0 16px 12px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 14px 18px;
    border: 1px solid rgba(255,255,255,0.9);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }

  .stat .val { font-size: 18px; font-weight: 700; color: var(--accent, #5b7ec2); }
  .stat .label { font-size: 10px; color: var(--ink3, #9aa8c7); }

  .action-btns {
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }

  .action-btn {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.9);
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    color: var(--accent, #5b7ec2);
    font-weight: 500;
    transition: transform 0.12s;
  }

  .action-btn:active { transform: scale(0.96); }
  .action-btn .emoji { font-size: 20px; display: block; margin-bottom: 4px; }

  .output-area {
    margin: 0 16px 12px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 16px 18px;
    border: 1px solid rgba(255,255,255,0.9);
    min-height: 100px;
  }

  .output-area .output-label {
    font-size: 11px;
    color: var(--ink3, #9aa8c7);
    margin-bottom: 8px;
  }

  .output-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink, #3a4a6b);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .cmd-row {
    margin: 0 16px 12px;
    display: flex;
    gap: 8px;
  }

  .cmd-row input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(100,140,210,0.2);
    background: rgba(255,255,255,0.8);
    font-size: 13px;
    color: var(--ink, #3a4a6b);
    outline: none;
  }

  .cmd-row input::placeholder { color: #c0ccdf; }

  .cmd-row button {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    background: var(--accent, #5b7ec2);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }

  .cmd-row button:active { opacity: 0.8; }

  .loading { color: var(--line, #b0bdd4); font-style: italic; }
</style>
<script src="/static/theme.js?v=40"></script>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="location.href='/'">
    <i data-lucide="chevron-left"></i>
  </button>
  <h1>🎣 钓鱼</h1>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat"><span class="val" id="stPts">-</span><span class="label">点数</span></div>
  <div class="stat"><span class="val" id="stLoc">-</span><span class="label">地点</span></div>
  <div class="stat"><span class="val" id="stSea">-</span><span class="label">季节</span></div>
  <div class="stat"><span class="val" id="stEnc">-</span><span class="label">图鉴</span></div>
  <div class="stat"><span class="val" id="stBait">-</span><span class="label">鱼饵</span></div>
  <div class="stat"><span class="val" id="stTurn">-</span><span class="label">回合</span></div>
</div>

<div class="action-btns">
  <div class="action-btn" onclick="doCmd('cast 5 stop=new,rare')">
    <span class="emoji">🎣</span>连钓5竿
  </div>
  <div class="action-btn" onclick="doCmd('cast 10 stop=new,rare')">
    <span class="emoji">🐟</span>连钓10竿
  </div>
  <div class="action-btn" onclick="doCmd('shop')">
    <span class="emoji">🏪</span>商店
  </div>
  <div class="action-btn" onclick="doCmd('encyclopedia')">
    <span class="emoji">📖</span>图鉴
  </div>
  <div class="action-btn" onclick="doCmd('inventory')">
    <span class="emoji">🎒</span>背包
  </div>
  <div class="action-btn" onclick="doCmd('goto')">
    <span class="emoji">🗺️</span>钓点
  </div>
  <div class="action-btn" onclick="doCmd('sell all')">
    <span class="emoji">💰</span>卖鱼
  </div>
  <div class="action-btn" onclick="doCmd('dive 3')">
    <span class="emoji">🤿</span>潜水
  </div>
</div>

<div class="cmd-row">
  <input type="text" id="cmdInput" placeholder="输入指令... 如 buy basic_worm 10"
         onkeydown="if(event.key==='Enter')sendCmd()">
  <button onclick="sendCmd()">执行</button>
</div>

<div class="output-area">
  <div class="output-label">输出</div>
  <div class="output-text" id="outputText">加载中...</div>
</div>

<script>
function updateStats(state) {
  if (!state) return;
  document.getElementById('stPts').textContent = state.pts || 0;
  document.getElementById('stLoc').textContent = state.loc || '-';
  document.getElementById('stSea').textContent = state.sea || '-';
  document.getElementById('stEnc').textContent = state.enc || '0/81';
  const baitTotal = Object.values(state.bait || {}).reduce((s, n) => s + n, 0);
  document.getElementById('stBait').textContent = baitTotal;
  document.getElementById('stTurn').textContent = state.turn || 0;
}

async function doCmd(cmd) {
  const out = document.getElementById('outputText');
  out.textContent = '执行中...';
  out.classList.add('loading');

  try {
    const res = await fetch('/api/fishing/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd })
    });
    const data = await res.json();
    out.classList.remove('loading');
    let text = data.result || '(无输出)';
    text = text.replace(/📊[^\n]*/g, '').trim();
    out.textContent = text;
    updateStats(data.state);
  } catch (e) {
    out.classList.remove('loading');
    out.textContent = '执行失败';
  }
}

function sendCmd() {
  const input = document.getElementById('cmdInput');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  doCmd(cmd);
}

async function init() {
  try {
    const res = await fetch('/api/fishing/status');
    const data = await res.json();
    let text = (data.result || '').replace(/📊[^\n]*/g, '').trim();
    document.getElementById('outputText').textContent = text;
    updateStats(data.state);
  } catch (e) {
    document.getElementById('outputText').textContent = '加载失败';
  }
  lucide.createIcons();
}

init();
</script>
</body>
</html>
